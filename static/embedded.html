<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Data Copilot</title>
<!-- 로컬 번들 (폐쇄망 호환 — 외부 CDN 의존 없음) -->
<script src="/vendor/marked.min.js"></script>
<script src="/vendor/hljs/highlight.min.js"></script>
<script src="/vendor/sql-formatter.min.js"></script>
<link rel="stylesheet" href="/vendor/hljs/github.min.css" id="hljs-light"/>
<link rel="stylesheet" href="/vendor/hljs/github-dark.min.css" id="hljs-dark" disabled/>
<link rel="stylesheet" href="/vendor/fonts/pretendard.css"/>
<style>
/* ══════════════════════════════════════
   CSS Variables — 3 themes
   ══════════════════════════════════════ */
:root{
  --bg:#fff;--bg2:#f5f4ef;--bg3:#eeece5;
  --bg-input:#f5f4ef;--bg-code:#f6f5f0;
  --bg-accent:#d97757;--bg-accent-hover:#c4623f;
  --bg-accent-subtle:#fdf4f0;--bg-accent-glow:rgba(217,119,87,.12);
  --txt:#1a1a1a;--txt2:#666460;--txt3:#a09e9a;--txt-inv:#fff;--txt-accent:#c4623f;
  --border:#e8e5dc;--border2:#dedad0;--border-accent:#f5d0c0;
  --sh-sm:0 1px 2px rgba(0,0,0,.06);--sh-md:0 4px 16px rgba(0,0,0,.09);
  --sh-focus:0 0 0 2px rgba(204,120,92,.22);
  --r-xs:4px;--r-sm:8px;--r-md:14px;--r-lg:20px;--r-full:9999px;
  --sans:'Noto Sans KR',-apple-system,system-ui,sans-serif;
  --ai-font:'Pretendard','Noto Sans KR',-apple-system,system-ui,sans-serif;
  --mono:'JetBrains Mono','Fira Code',monospace;
  --ease:cubic-bezier(.16,1,.3,1);--t-fast:120ms;--t:200ms;--t-slow:350ms;
  --sw:252px;--mx:700px;
  color-scheme:light;
}
[data-theme="dim"]{
  --bg:#2b2a27;--bg2:#333230;--bg3:#3a3936;
  --bg-input:#2a2926;--bg-code:#2e2d2a;
  --bg-accent-subtle:#3d302a;--bg-accent-hover:#e8906e;--bg-accent-glow:rgba(217,119,87,.16);
  --txt:#e8e6e0;--txt2:#b0ada5;--txt3:#7a7770;--txt-accent:#e8906e;
  --border:#46443f;--border2:#3a3936;--border-accent:#503d32;
  --sh-sm:0 1px 3px rgba(0,0,0,.25);--sh-md:0 4px 16px rgba(0,0,0,.35);
  --sh-focus:0 0 0 2px rgba(217,119,87,.25);
  color-scheme:dark;
}
[data-theme="dark"]{
  --bg:#0e0e10;--bg2:#19191d;--bg3:#222226;
  --bg-input:#1e1e22;--bg-code:#1a1a1e;
  --bg-accent-subtle:#2a1f1a;--bg-accent-glow:rgba(217,119,87,.2);
  --bg-accent-hover:#e8906e;
  --txt:#ececef;--txt2:#a0a0a8;--txt3:#5c5c66;--txt-accent:#e8906e;
  --border:#2c2c31;--border2:#222226;--border-accent:#3d2a22;
  --sh-sm:0 1px 3px rgba(0,0,0,.4);--sh-md:0 4px 16px rgba(0,0,0,.6);
  --sh-focus:0 0 0 2px rgba(217,119,87,.3);
  color-scheme:dark;
}

/* ══ Reset ══ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--sans);background:var(--bg);color:var(--txt);
  font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,textarea,input,select{font-family:var(--sans)}
button{cursor:pointer}

/* ══ Layout ══ */
.app{display:flex;height:100vh;overflow:hidden}

/* ── Sidebar ── */
.sidebar{width:var(--sw);min-width:var(--sw);background:var(--bg2);
  border-right:1px solid var(--border);display:flex;flex-direction:column;
  overflow:hidden;z-index:20;
  transition:width var(--t) var(--ease),min-width var(--t) var(--ease)}
.sidebar.collapsed{width:0;min-width:0}
/* topbar 토글 버튼: 사이드바 상태에 따라 아이콘 회전 */
#togSb svg{transition:transform var(--t) var(--ease)}
.sidebar:not(.collapsed)~.main #togSb svg{transform:rotate(180deg)}
.sb-head{padding:13px 13px 9px;display:flex;align-items:center;justify-content:flex-start}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--txt)}
.logo-svg{width:22px;height:22px;flex-shrink:0}
.logo-name{font-size:14px;font-weight:600;white-space:nowrap}
.new-btn{display:flex;align-items:center;gap:7px;margin:5px 9px;padding:7px 11px;
  background:var(--bg);border:1px solid var(--border);border-radius:var(--r-sm);
  color:var(--txt);font-size:13px;font-weight:500;width:calc(100% - 18px);transition:all var(--t)}
.new-btn:hover{background:var(--bg3);border-color:var(--border2)}
.sb-label{padding:9px 13px 3px;font-size:10.5px;font-weight:600;color:var(--txt3);
  text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.chat-list{flex:1;overflow-y:auto;padding:2px 7px}
.chat-list::-webkit-scrollbar{width:4px}
.chat-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.chat-item{display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:var(--r-sm);
  font-size:13px;color:var(--txt2);transition:all var(--t);white-space:nowrap;
  cursor:pointer;border:none;background:none;width:100%;text-align:left}
.chat-item:hover,.chat-item.active{background:var(--bg3);color:var(--txt)}
.chat-item>svg{flex-shrink:0;opacity:.4}
.sb-foot{padding:8px 9px;border-top:1px solid var(--border)}
.set-btn{display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:var(--r-sm);
  font-size:13px;color:var(--txt2);border:none;background:none;width:100%;transition:all var(--t)}
.set-btn:hover{background:var(--bg3);color:var(--txt)}

/* ── Main ── */
.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden;position:relative}

/* Topbar */
.topbar{height:50px;display:flex;align-items:center;justify-content:space-between;
  padding:0 13px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--bg)}
.tb-l,.tb-r{display:flex;align-items:center;gap:4px}
.ic{width:32px;height:32px;border:none;background:none;color:var(--txt2);
  border-radius:var(--r-xs);display:flex;align-items:center;justify-content:center;
  transition:all var(--t);flex-shrink:0}
.ic:hover{background:var(--bg3);color:var(--txt)}
.model-pill{display:flex;align-items:center;gap:6px;padding:4px 10px;
  border:1px solid var(--border);border-radius:100px;font-size:13px;font-weight:500;
  color:var(--txt2);background:none;transition:all var(--t)}
.model-pill:hover{border-color:var(--border2);color:var(--txt)}
.mpd{width:6px;height:6px;border-radius:50%;background:var(--bg-accent);flex-shrink:0}
.header-status{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--txt3);padding-right:4px}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--txt3);transition:background var(--t)}
.status-dot.connected{background:#22c55e}
.status-dot.connecting{background:#f59e0b;animation:pulseDot 1.4s infinite}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.25}}

/* Theme toggle icon switching */
.theme-ico-sun,.theme-ico-dim{display:none}
[data-theme="dim"] .theme-ico-moon{display:none}
[data-theme="dim"] .theme-ico-dim{display:block}
[data-theme="dark"] .theme-ico-moon{display:none}
[data-theme="dark"] .theme-ico-sun{display:block}

/* ══ Chat Container ══ */
.chat-wrap{flex:1;overflow-y:auto;position:relative;background:var(--bg);
  transition:background var(--t-slow) var(--ease)}
.chat-wrap::-webkit-scrollbar{width:5px}
.chat-wrap::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.chat-inner{max-width:var(--mx);margin:0 auto;padding:24px 24px 12px;display:flex;flex-direction:column;gap:4px}

/* ── Welcome ── */
.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:52vh;text-align:center;gap:13px;padding:40px 16px;animation:fadeUp .5s var(--ease)}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.wlc-logo{width:48px;height:48px;margin-bottom:4px}
.welcome h2{font-size:19px;font-weight:700;letter-spacing:-.03em}
.welcome p{font-size:13.5px;color:var(--txt2);max-width:340px}
.starter-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:9px;width:100%;max-width:440px}
.sc{padding:10px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-sm);
  text-align:left;font-size:12.5px;color:var(--txt2);line-height:1.5;transition:all var(--t)}
.sc:hover{border-color:var(--bg-accent);background:var(--bg-accent-subtle);color:var(--txt-accent);
  transform:translateY(-1px);box-shadow:var(--sh-sm)}
.sc strong{display:block;color:var(--txt);font-size:12.5px;margin-bottom:2px}
.sc:hover strong{color:var(--txt-accent)}

/* ══ Message Rows ══ */
.message-row{display:flex;gap:10px;max-width:var(--mx);width:100%;margin:0 auto;animation:msgIn .3s var(--ease)}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.message-row.user{justify-content:flex-end;padding-left:48px;margin-bottom:8px}
.message-row.assistant{justify-content:flex-start;margin-bottom:24px}
.message-row.system{justify-content:center;margin-bottom:6px}
.msg-content{max-width:88%;min-width:48px}
.message-row.assistant .msg-content{width:88%}

/* AI logo — 마지막 답변 하단 좌측에만 표시 */
.ai-logo{width:28px;height:28px;margin-top:20px;opacity:0;transition:opacity var(--t);pointer-events:none;position:relative}
.ai-logo svg{width:28px;height:28px}
.ai-logo.visible{opacity:.45}
/* ── thinking: 물방울 파동 (ripple) ── */
.ai-logo.thinking{opacity:.8}
.ai-logo.thinking svg{animation:logoDrop 2.4s cubic-bezier(.4,0,.2,1) infinite}
.ai-logo.thinking::before,.ai-logo.thinking::after{
  content:'';position:absolute;inset:-4px;border-radius:50%;
  border:1.5px solid #D97757;opacity:0;
  animation:logoRipple 2.4s cubic-bezier(.4,0,.2,1) infinite}
.ai-logo.thinking::after{animation-delay:.6s}
@keyframes logoDrop{
  0%{transform:translateY(0) scale(1);opacity:.7}
  15%{transform:translateY(-6px) scale(.92);opacity:1}
  30%{transform:translateY(2px) scale(1.08);opacity:1}
  45%{transform:translateY(-1px) scale(.98);opacity:.9}
  60%{transform:translateY(0) scale(1);opacity:.8}
  100%{transform:translateY(0) scale(1);opacity:.7}
}
@keyframes logoRipple{
  0%{transform:scale(.6);opacity:0}
  30%{transform:scale(.6);opacity:0}
  50%{opacity:.5}
  100%{transform:scale(1.8);opacity:0}
}
/* ── streaming: 물방울 떨어지며 회전 ── */
.ai-logo.streaming{opacity:1}
.ai-logo.streaming svg{animation:logoStreamDrop 1.8s cubic-bezier(.4,0,.2,1) infinite}
.ai-logo.streaming::before{
  content:'';position:absolute;inset:-4px;border-radius:50%;
  border:1.5px solid #D97757;opacity:0;
  animation:logoRipple 1.8s cubic-bezier(.4,0,.2,1) infinite}
@keyframes logoStreamDrop{
  0%{transform:translateY(0) rotate(0deg) scale(1);opacity:.8}
  20%{transform:translateY(-5px) rotate(60deg) scale(.9);opacity:1}
  40%{transform:translateY(3px) rotate(120deg) scale(1.1);opacity:1}
  60%{transform:translateY(-1px) rotate(180deg) scale(.98);opacity:.9}
  80%{transform:translateY(0) rotate(300deg) scale(1);opacity:.85}
  100%{transform:translateY(0) rotate(360deg) scale(1);opacity:.8}
}

/* User bubble */
.msg-bubble.user-bubble{background:var(--bg3);color:var(--txt);padding:10px 15px;
  border-radius:var(--r-md);border-bottom-right-radius:var(--r-xs);
  line-height:1.65;font-size:14px;white-space:pre-wrap;word-break:break-word}
/* System bubble */
.msg-bubble.system-bubble{background:var(--bg2);color:var(--txt2);font-size:13px;
  padding:12px 16px;border-radius:var(--r-sm);border:1px solid var(--border);
  font-family:var(--mono);line-height:1.7;white-space:pre-wrap;
  max-height:400px;overflow-y:auto;max-width:var(--mx);width:100%}
.msg-bubble.system-bubble::-webkit-scrollbar{width:4px}
.msg-bubble.system-bubble::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* ══ AI Text — Markdown ══ */
.msg-bubble.bot-bubble{background:transparent;border:none;padding:8px 0;border-radius:0;
  font-family:var(--ai-font);font-size:14px;line-height:var(--line-height,1.6);letter-spacing:-0.01em;word-break:break-word}
.bot-bubble p{margin-bottom:8px}
.bot-bubble p:last-child{margin-bottom:0}
.bot-bubble h1,.bot-bubble h2,.bot-bubble h3{font-weight:600;margin:18px 0 8px;line-height:1.3}
.bot-bubble h1{font-size:19px}
.bot-bubble h2{font-size:16px}
.bot-bubble h3{font-size:14.5px}
.bot-bubble ul,.bot-bubble ol{padding-left:22px;margin-bottom:8px}
.bot-bubble li{margin-bottom:2px}
.bot-bubble strong{font-weight:600}
.bot-bubble a{color:var(--txt-accent);text-underline-offset:3px}
.bot-bubble code:not(pre code){background:var(--bg-code);border:1px solid var(--border);
  padding:1px 5px;border-radius:4px;font-size:12.5px;font-family:var(--mono)}
.bot-bubble pre{background:var(--bg-code);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:14px 16px;margin:12px 0;overflow-x:auto;position:relative}
.bot-bubble pre code{font-size:var(--code-fs,13px);font-family:var(--mono);line-height:1.6;
  background:none;border:none;padding:0}
.bot-bubble blockquote{border-left:3px solid var(--bg-accent);padding-left:13px;
  margin:12px 0;color:var(--txt2);font-style:italic}
.bot-bubble hr{border:none;border-top:1px solid var(--border);margin:16px 0}
.bot-bubble table{width:100%;border-collapse:collapse;margin:12px 0;font-size:13px}
.bot-bubble th,.bot-bubble td{border:none;border-bottom:1px solid var(--border);padding:7px 10px;text-align:left}
.bot-bubble th{font-weight:600;color:var(--txt2);font-size:12px;border-bottom:2px solid var(--border2)}

/* ── Content copy button (공통) ── */
.code-wrap{position:relative}
.table-wrap{
  position:relative;overflow-x:auto;overflow-y:auto;
  max-height:480px;background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--r-sm);margin:12px 0
}
.table-wrap table{width:100%;border-collapse:collapse;margin:0;font-size:13px}
.table-wrap th{font-weight:600;color:var(--txt2);font-size:12px;padding:8px 14px;
  text-align:left;border-bottom:2px solid var(--border2);white-space:nowrap;background:var(--bg)}
.table-wrap td{padding:8px 14px;text-align:left;border-bottom:1px solid var(--border)}
.table-wrap tbody tr:hover td{background:color-mix(in srgb,var(--txt) 4%,transparent)}
.content-copy{position:absolute;top:6px;right:8px;padding:3px 10px;
  background:color-mix(in srgb,var(--bg) 85%,transparent);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  border:1px solid var(--border);border-radius:var(--r-xs);font-size:11px;
  color:var(--txt2);opacity:0;transition:opacity var(--t);cursor:pointer;z-index:2;
  display:flex;align-items:center;gap:4px;line-height:1}
.content-copy svg{width:11px;height:11px;flex-shrink:0}
.content-copy:hover{background:var(--bg3);color:var(--txt)}
.table-copy-wrap{position:relative;margin:12px 0}
.table-copy-wrap>.table-wrap{margin:0}
.code-wrap:hover .content-copy,
.table-wrap:hover .content-copy,
.table-copy-wrap:hover>.content-copy,
.viz-body:hover>.content-copy{opacity:1}

/* Message actions (copy, regen) */
.msg-actions{display:flex;align-items:center;gap:1px;margin-top:5px}
.act-btn{width:28px;height:28px;border:none;background:none;color:var(--txt3);
  border-radius:var(--r-xs);display:flex;align-items:center;justify-content:center;transition:all var(--t)}
.act-btn:hover{background:var(--bg3);color:var(--txt)}

/* Streaming cursor */
.streaming-cursor{display:inline-block;width:2px;height:1.1em;background:var(--bg-accent);
  margin-left:2px;vertical-align:text-bottom;border-radius:1px;animation:blink .75s step-end infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* ══ Thinking Indicator (간결 버전) ══ */
.thinking-indicator{display:inline-flex;align-items:center;gap:0;padding:4px 0;animation:fadeUp .3s var(--ease)}
.thinking-spinner{display:none}
.thinking-label{font-size:13px;font-weight:400;color:var(--txt3)}

/* ══ Progress Steps ══ */
/* 전체 컨테이너 */
.progress-phases{display:flex;flex-direction:column;gap:2px;margin-bottom:4px}
/* Phase 헤더 */
.progress-phase{display:flex;flex-direction:column}
.phase-header{display:inline-flex;align-items:center;gap:6px;padding:3px 0;cursor:pointer;user-select:none}
.phase-header:hover .phase-label{color:var(--txt2)}
.phase-tag{font-size:10px;font-weight:600;letter-spacing:.03em;color:var(--txt3);
  background:var(--bg3);padding:1px 6px;border-radius:var(--r-xs);flex-shrink:0}
.phase-label{font-size:13px;color:var(--txt3);font-weight:400;transition:color var(--t);flex:1}
.phase-chevron{width:14px;height:14px;display:grid;place-items:center;
  color:var(--txt3);transition:transform var(--t) var(--ease);transform:rotate(-90deg);flex-shrink:0}
.phase-chevron svg{width:12px;height:12px}
.phase-status-icon{width:14px;height:14px;display:grid;place-items:center;flex-shrink:0}
.phase-status-icon svg{width:12px;height:12px}
/* Phase 상태별 */
.progress-phase.active .phase-tag{color:var(--txt2);background:var(--bg3)}
.progress-phase.active .phase-label{color:var(--txt2)}
.progress-phase.active .phase-chevron{transform:rotate(0deg)}
.progress-phase.active .phase-status-icon{display:none}
.progress-phase.done .phase-status-icon svg{color:var(--txt3)}
.progress-phase.pending .phase-label{color:var(--txt3);opacity:.5}
.progress-phase.pending .phase-tag{opacity:.5}
/* Phase 하위 스텝 */
.phase-steps{overflow:hidden;max-height:0;opacity:0;
  transition:max-height var(--t-slow) var(--ease),opacity var(--t) var(--ease)}
.progress-phase.active .phase-steps,.progress-phase.expanded .phase-steps{max-height:none;opacity:1}
.phase-steps-inner{display:flex;flex-direction:column;gap:1px;padding:2px 0 4px 22px;
  border-left:2px solid var(--border);margin-left:6px}
.progress-phase.active .phase-steps-inner{border-left-color:var(--border2)}
.phase-steps-fade{height:20px;
  background:linear-gradient(to bottom,transparent,var(--bg));
  margin-left:-22px;margin-top:-16px;position:relative;pointer-events:none}
.phase-expand-btn{
  display:inline-flex;align-items:center;gap:4px;
  font-size:11px;color:var(--txt3);cursor:pointer;
  padding:4px 0 0 28px;background:none;border:none}
.phase-expand-btn:hover{color:var(--txt2)}
/* 개별 스텝 */
.progress-step{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--txt3);padding:2px 0}
.progress-step .step-icon{width:14px;height:14px;display:grid;place-items:center;flex-shrink:0}
.progress-step .step-icon svg{width:12px;height:12px}
.progress-step.active .step-icon svg{animation:none;color:var(--txt2)}
.progress-step.active{color:var(--txt2);font-weight:500}
.progress-step.done{color:var(--txt3)}
.progress-step.done .step-icon{display:none}
@keyframes spinStep{from{transform:rotate(0)}to{transform:rotate(360deg)}}
/* 접힌 상태 요약 */
.progress-collapsed-summary{display:inline-flex;align-items:center;gap:6px;padding:2px 0;
  cursor:pointer;user-select:none}
.progress-collapsed-summary:hover .summary-text{color:var(--txt2)}
.summary-text{font-size:13px;color:var(--txt3);font-weight:400;transition:color var(--t)}
.summary-chevron{width:14px;height:14px;display:grid;place-items:center;
  color:var(--txt3);transition:transform var(--t) var(--ease);transform:rotate(-90deg)}
.summary-chevron svg{width:12px;height:12px}
.progress-block.expanded .summary-chevron{transform:rotate(0deg)}

/* ══ Visualization / Rich content block ══ */
.viz-container{margin:16px 0;overflow:hidden}
.viz-title{font-size:12px;color:var(--txt3);margin-bottom:8px;font-weight:400}
.viz-body{padding:20px;background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--r-md);overflow:hidden;position:relative}
.viz-body svg{max-width:100%;height:auto;display:block;margin:0 auto}
/* Rich HTML table inside viz-body */
.viz-body table{width:100%;border-collapse:collapse;font-size:13px}
.viz-body th,.viz-body td{border:none;border-bottom:1px solid var(--border);padding:10px 14px;text-align:left}
.viz-body th{font-weight:600;color:var(--txt2);font-size:12px;border-bottom:2px solid var(--border2)}
.viz-body td:first-child{font-weight:600}
.viz-actions{margin-top:8px;display:flex;gap:8px;justify-content:flex-start}
.viz-actions button{padding:5px 16px;font-size:11.5px;font-family:var(--sans);
  background:var(--bg-accent-subtle);border:1px solid var(--border-accent);
  border-radius:var(--r-full);cursor:pointer;color:var(--txt-accent);font-weight:500;transition:all var(--t-fast)}
.viz-actions button:hover{background:var(--bg-accent-glow)}

/* Status banner */
.status-banner{max-width:var(--mx);width:100%;margin:4px auto;padding:8px 14px;
  border-radius:var(--r-sm);font-size:12.5px;text-align:center;animation:fadeUp .25s var(--ease)}
.status-banner.status{background:var(--bg-accent-subtle);color:var(--txt-accent)}
.status-banner.error{background:#fef2f2;color:#991b1b}
[data-theme="dim"] .status-banner.error{background:#3d2a2a;color:#f87171}
[data-theme="dark"] .status-banner.error{background:#2a1515;color:#f87171}

/* ══ Input Area ══ */
.in-area{flex-shrink:0;padding:10px 24px 18px;background:var(--bg)}
.in-inner{max-width:var(--mx);margin:0 auto;position:relative}
.in-box{background:var(--bg-input);border:1.5px solid var(--border2);border-radius:var(--r-lg);
  padding:12px 14px 10px;transition:border-color var(--t),box-shadow var(--t)}
.in-box:focus-within{border-color:var(--bg-accent);box-shadow:var(--sh-focus)}
.in-ta{width:100%;background:none;border:none;outline:none;resize:none;font-size:14px;
  color:var(--txt);line-height:1.6;min-height:24px;max-height:200px;overflow-y:auto;padding:0}
.in-ta::placeholder{color:var(--txt3)}
.in-ta::-webkit-scrollbar{width:3px}
.in-ta::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.in-foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.in-left{display:flex;align-items:center;gap:2px}
.stream-toggle{width:28px;height:28px;border:none;background:none;border-radius:var(--r-xs);
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all var(--t);color:var(--txt3)}
.stream-toggle:hover{background:var(--bg3)}
.stream-toggle.on{color:var(--bg-accent)}
.stream-toggle.on:hover{color:var(--bg-accent)}
.tb{width:28px;height:28px;border:none;background:none;color:var(--txt3);border-radius:var(--r-xs);
  display:flex;align-items:center;justify-content:center;transition:all var(--t)}
.tb:hover{background:var(--bg3);color:var(--txt)}
.send-btn{width:32px;height:32px;border:none;background:var(--bg-accent);color:var(--txt-inv);
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  transition:all var(--t) var(--ease);flex-shrink:0}
.send-btn:hover:not(:disabled){background:var(--bg-accent-hover);transform:scale(1.06)}
.send-btn:disabled{background:var(--border2);color:var(--txt3);cursor:not-allowed;transform:none}
.send-btn.cancel{background:#fef2f2;color:#991b1b;border:1px solid var(--border-accent)}
[data-theme="dim"] .send-btn.cancel,[data-theme="dark"] .send-btn.cancel{background:#3d2a2a;color:#f87171}
.send-btn.cancel:hover{opacity:.85;transform:none}
.in-hint{text-align:center;font-size:11px;color:var(--txt3);margin-top:8px}

/* ══ Command Popup ══ */
.cmd-popup{position:absolute;bottom:100%;left:0;right:0;margin-bottom:6px;
  background:var(--bg);border:1px solid var(--border);border-radius:var(--r-sm);
  box-shadow:var(--sh-md);overflow:hidden;z-index:20;animation:cmdUp .15s var(--ease)}
@keyframes cmdUp{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.cmd-item{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;transition:background var(--t-fast)}
.cmd-item:hover,.cmd-item.active{background:var(--bg3)}
.cmd-item-icon{width:28px;height:28px;border-radius:var(--r-xs);background:var(--bg2);
  display:grid;place-items:center;font-size:14px;flex-shrink:0}
.cmd-item-text{flex:1;min-width:0}
.cmd-item-name{font-size:13px;font-weight:600;color:var(--txt);font-family:var(--mono)}
.cmd-item-desc{font-size:11.5px;color:var(--txt3);margin-top:1px}
.cmd-item-key{font-size:10px;font-family:var(--mono);color:var(--txt-accent);
  background:var(--bg2);border:1px solid var(--border);padding:2px 6px;border-radius:3px;flex-shrink:0}

/* ══ Modal ══ */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);
  z-index:100;display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s}
.modal-bg.open{opacity:1;pointer-events:all}
.modal{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:26px;width:400px;max-width:90vw;box-shadow:var(--sh-md);
  transform:translateY(10px);transition:transform .2s}
.modal-bg.open .modal{transform:translateY(0)}
.modal h2{font-size:15px;font-weight:600;margin-bottom:18px;display:flex;align-items:center;gap:8px}
.fg{margin-bottom:13px}
.fl{display:block;font-size:11.5px;font-weight:600;color:var(--txt2);margin-bottom:5px;
  text-transform:uppercase;letter-spacing:.05em}
.fi,.fsel{width:100%;padding:8px 11px;background:var(--bg2);border:1.5px solid var(--border2);
  border-radius:var(--r-sm);font-size:14px;color:var(--txt);outline:none;
  transition:border-color var(--t),box-shadow var(--t)}
.fi:focus,.fsel:focus{border-color:var(--bg-accent);box-shadow:var(--sh-focus)}
.ma{display:flex;gap:7px;margin-top:18px;justify-content:flex-end}
.mbtn{padding:7px 16px;border-radius:var(--r-sm);font-size:13.5px;font-weight:500;border:none;transition:all var(--t)}
.mbtn-s{background:var(--bg3);color:var(--txt2)}
.mbtn-s:hover{background:var(--border2)}
.mbtn-p{background:var(--bg-accent);color:#fff}
.mbtn-p:hover{background:var(--bg-accent-hover)}
.mbtn-d{background:#991b1b;color:#fff}
.mbtn-d:hover{background:#7f1d1d}
[data-theme="dim"] .mbtn-d,[data-theme="dark"] .mbtn-d{background:#b91c1c}
[data-theme="dim"] .mbtn-d:hover,[data-theme="dark"] .mbtn-d:hover{background:#991b1b}
.confirm-msg{font-size:14px;color:var(--txt);line-height:1.6;margin-bottom:4px}
.confirm-hint{font-size:11.5px;color:var(--txt3);margin-top:14px;display:flex;align-items:center;gap:12px;justify-content:center}
.confirm-hint kbd{display:inline-flex;align-items:center;padding:1px 6px;
  background:var(--bg2);border:1px solid var(--border);border-radius:3px;
  font-family:var(--mono);font-size:10px;color:var(--txt3)}

/* ══ Toast ══ */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);
  background:var(--txt);color:var(--bg);padding:7px 16px;border-radius:100px;
  font-size:13px;font-weight:500;z-index:300;pointer-events:none;white-space:nowrap;
  transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.toast.show{transform:translateX(-50%) translateY(0)}

/* ══ Insight Panel ══ */
.insight-slot{max-height:0;overflow:hidden;opacity:0;
  transition:max-height .4s var(--ease),opacity .3s var(--ease),margin .3s var(--ease)}
.insight-slot.open{max-height:3000px;opacity:1;margin-top:12px}
.insight-panel{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:16px;font-size:13px;line-height:1.6;max-height:60vh;overflow-y:auto}
.insight-panel::-webkit-scrollbar{width:4px}
.insight-panel::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.insight-section{margin-bottom:14px}
.insight-section:last-child{margin-bottom:0}
.insight-title{font-weight:600;font-size:13px;margin-bottom:6px;color:var(--txt)}
.insight-body{padding-left:4px}
.insight-row{display:flex;gap:8px;padding:2px 0}
.insight-key{color:var(--txt3);min-width:48px;font-weight:500}
.insight-table{padding:6px 10px;margin-bottom:4px;border-radius:var(--r-xs);font-size:12.5px}
.insight-table.used{background:var(--bg-accent-subtle);border-left:3px solid #22c55e}
.insight-table.candidate{background:var(--bg2);border-left:3px solid #f59e0b;opacity:.85}
.insight-table.rejected{background:var(--bg2);border-left:3px solid var(--txt3);opacity:.7}
.insight-desc{color:var(--txt2);font-size:12px}
.insight-reason{color:var(--txt2);font-size:12px;margin-top:2px}
.insight-cols{font-size:11px;color:var(--txt3);margin-top:2px;font-family:var(--mono)}
.insight-sql-summary{font-weight:500;margin-bottom:4px}
.insight-join{font-size:12px;color:var(--txt2);margin-bottom:6px}
.insight-ref{font-size:12.5px;color:var(--txt2);padding:2px 0}
.insight-conf{font-weight:600;padding:1px 8px;border-radius:var(--r-full);font-size:11.5px}
.insight-conf.high{background:#dcfce7;color:#166534}
.insight-conf.mid{background:#fef3c7;color:#92400e}
.insight-conf.low{background:#fee2e2;color:#991b1b}
[data-theme="dim"] .insight-conf.high,[data-theme="dark"] .insight-conf.high{background:#14532d;color:#86efac}
[data-theme="dim"] .insight-conf.mid,[data-theme="dark"] .insight-conf.mid{background:#78350f;color:#fcd34d}
[data-theme="dim"] .insight-conf.low,[data-theme="dark"] .insight-conf.low{background:#7f1d1d;color:#fca5a5}
.insight-caveat{font-size:12.5px;color:var(--txt-accent);padding:2px 0}
.insight-timing{display:flex;justify-content:space-between;padding:2px 0;font-size:12px;color:var(--txt2)}
.insight-panel details:not(.ij-hypo):not(.ij-tool):not(.ij-sql-fold){margin-top:4px}
.insight-panel>:not(.ij-hypo) summary{cursor:pointer;font-size:12px;color:var(--txt-accent);font-weight:500}
.insight-panel pre{margin-top:6px;font-size:12px}
.insight-trail{list-style:none;padding:0;margin:0}
.insight-trail-item{position:relative;padding:3px 0 3px 16px;font-size:12.5px;color:var(--txt2);line-height:1.5}
.insight-trail-item::before{content:'';position:absolute;left:4px;top:10px;width:5px;height:5px;border-radius:50%;background:var(--txt3)}
.insight-trail-item.warn{color:var(--txt-accent)}
.insight-trail-item.warn::before{background:var(--txt-accent)}
.insight-validation-item{display:flex;gap:8px;padding:3px 0;font-size:12.5px;color:var(--txt2)}
.insight-validation-item .vd-label{min-width:110px;font-weight:500;color:var(--txt3)}
.insight-failure-box{padding:10px 12px;background:var(--bg3);border-left:3px solid #ef4444;border-radius:var(--r-xs);font-size:12.5px;color:var(--txt);line-height:1.6;white-space:pre-wrap}
.insight-deadend{padding:8px 10px;margin-bottom:6px;background:var(--bg2);border-radius:var(--r-xs);font-size:12.5px}
.insight-more-wrap{position:relative}
.insight-more-wrap.collapsed::after{content:'';position:absolute;bottom:0;left:0;right:0;
  height:48px;background:linear-gradient(transparent,var(--bg2));pointer-events:none}
.insight-toggle-more{display:inline-flex;align-items:center;gap:4px;
  font-size:12px;color:var(--txt-accent);cursor:pointer;padding:6px 0;
  background:none;border:none;font-weight:500}
.insight-toggle-more:hover{text-decoration:underline}
.insight-deadend-type{font-weight:600;color:var(--txt3);font-size:11px;letter-spacing:.02em}
.insight-deadend-reason{color:var(--txt2);margin-top:2px}
.insight-deadend-lesson{color:var(--txt-accent);font-size:12px;margin-top:3px;font-style:italic}

/* ══ Journey View (분석 과정 보기 — 가설 기반 트리) ══ */
.ij-hypo{margin-bottom:10px;border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden}
.ij-hypo[open]{background:var(--bg3)}
.ij-hypo-head{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;
  font-size:13px;font-weight:600;color:var(--txt);list-style:none}
.ij-hypo-head::-webkit-details-marker{display:none}
.ij-hypo-head::before{content:'▸';font-size:11px;color:var(--txt3);transition:transform .2s}
.ij-hypo[open]>.ij-hypo-head::before{transform:rotate(90deg)}
.ij-hypo-id{color:var(--txt3);font-size:12px;min-width:40px}
.ij-hypo-desc{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ij-hypo-badge{font-size:11px;padding:1px 8px;border-radius:var(--r-full);font-weight:600}
.ij-hypo-badge.success{background:#dcfce7;color:#166534}
.ij-hypo-badge.failed{background:#fee2e2;color:#991b1b}
[data-theme="dim"] .ij-hypo-badge.success,[data-theme="dark"] .ij-hypo-badge.success{background:#14532d;color:#86efac}
[data-theme="dim"] .ij-hypo-badge.failed,[data-theme="dark"] .ij-hypo-badge.failed{background:#7f1d1d;color:#fca5a5}
.ij-hypo-body{padding:0 12px 12px}
.ij-strategy{font-size:12px;color:var(--txt2);margin-bottom:10px;padding-left:4px;
  border-left:2px solid var(--border);padding:4px 0 4px 8px}
.ij-section-title{font-size:12.5px;font-weight:600;color:var(--txt);margin:10px 0 6px;display:flex;align-items:center;gap:4px}
.ij-tool{margin-bottom:6px;border-left:2px solid var(--border);margin-left:4px}
.ij-tool>summary{cursor:pointer;padding:4px 8px;font-size:12.5px;color:var(--txt2);
  font-weight:500;list-style:none;display:flex;align-items:center;gap:4px}
.ij-tool>summary::-webkit-details-marker{display:none}
.ij-tool>summary::before{content:'▸';font-size:10px;color:var(--txt3);transition:transform .15s}
.ij-tool[open]>summary::before{transform:rotate(90deg)}
.ij-tool-body{padding:2px 0 2px 20px}
.ij-item{display:flex;gap:6px;padding:2px 0;font-size:12px;line-height:1.5}
.ij-item-icon{flex-shrink:0;width:16px;text-align:center}
.ij-item-name{font-weight:600;color:var(--txt);white-space:nowrap}
.ij-item-sep{color:var(--txt3)}
.ij-item-label{color:var(--txt2);flex:1}
.ij-item.rejected .ij-item-name{color:var(--txt3);font-weight:400}
.ij-item.rejected .ij-item-label{color:var(--txt3)}
.ij-readiness{display:flex;align-items:center;gap:8px;margin:10px 0;
  padding:6px 10px;background:var(--bg2);border-radius:var(--r-xs);font-size:12.5px}
.ij-readiness-score{font-weight:700;font-size:14px}
.ij-readiness-label{color:var(--txt2)}
.ij-sql-fold{margin:8px 0}
.ij-sql-fold>summary{cursor:pointer;font-size:12.5px;color:var(--txt-accent);font-weight:500;
  list-style:none;display:flex;align-items:center;gap:4px}
.ij-sql-fold>summary::-webkit-details-marker{display:none}
.ij-sql-fold>summary::before{content:'▸';font-size:10px;transition:transform .15s}
.ij-sql-fold[open]>summary::before{transform:rotate(90deg)}
.ij-sql-fold pre{margin:6px 0 0;border-radius:var(--r-xs);overflow-x:auto}
.ij-sql-fold pre code{font-size:12px;line-height:1.5}
.ij-validation{margin:8px 0}
.ij-val-head{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:4px}
.ij-val-items{padding-left:4px;margin-top:4px}
.ij-val-item{display:flex;gap:6px;padding:2px 0;font-size:12px;color:var(--txt2)}
.ij-val-item .vl{min-width:100px;font-weight:500;color:var(--txt3)}
.ij-failure{margin:8px 0;padding:8px 10px;background:var(--bg2);border-left:3px solid #ef4444;
  border-radius:var(--r-xs);font-size:12.5px}
.ij-failure-type{font-weight:600;color:var(--txt);margin-bottom:2px}
.ij-failure-reason{color:var(--txt2);white-space:pre-wrap}
.ij-failure-lesson{color:var(--txt-accent);font-size:12px;margin-top:4px;font-style:italic}
.ij-footer{margin-top:12px;padding-top:10px;border-top:1px solid var(--border)}
.ij-elapsed{font-size:12px;color:var(--txt2);margin-bottom:6px}
.ij-caveats{font-size:12.5px}
.ij-caveat{color:var(--txt-accent);padding:2px 0}

/* ══ Trace dropdown ══ */
.trace-dropdown{
  position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:4px;
  background:var(--bg);border:1px solid var(--border);
  border-radius:var(--r-sm);box-shadow:var(--sh-md);
  min-width:200px;z-index:20;overflow:hidden}
.trace-item{
  display:block;padding:8px 14px;font-size:12.5px;
  color:var(--txt);text-decoration:none;
  transition:background var(--t-fast)}
.trace-item:hover{background:var(--bg3)}

/* ══ Result Data Table ══ */
.table-truncated{text-align:center;padding:8px;font-size:12px;color:var(--txt3);
  border-top:1px solid var(--border)}

/* ══ Process Summary / ref-block ══ */
.ref-block{background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--r-sm);margin:16px 0;overflow:hidden;width:100%}
.ref-header{display:flex;align-items:center;gap:8px;
  padding:10px 14px;cursor:pointer;user-select:none;list-style:none}
.ref-header::-webkit-details-marker{display:none}
.ref-tag{font-size:11px;font-weight:600;color:var(--txt3);
  background:var(--bg3);padding:2px 8px;border-radius:var(--r-xs)}
.ref-title{font-size:13px;font-weight:600;color:var(--txt2);flex:1}
.ref-chevron{transition:transform var(--t)}
.ref-block:not([open]) .ref-chevron{transform:rotate(-90deg)}
.ref-body{padding:0 14px 12px;font-size:13px;line-height:1.6}
/* ── Process summary stage sections ── */
.ps-stage{border-bottom:1px solid var(--border);padding:10px 0}
.ps-stage:last-child{border-bottom:none}
.ps-stage-head{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;list-style:none}
.ps-stage-head::-webkit-details-marker{display:none}
.ps-stage-num{width:20px;height:20px;border-radius:50%;background:var(--bg3);
  font-size:10px;font-weight:700;color:var(--txt3);display:flex;align-items:center;
  justify-content:center;flex-shrink:0}
.ps-stage-title{font-size:13px;font-weight:600;color:var(--txt);flex:1}
.ps-stage-brief{font-size:12px;color:var(--txt3);max-width:220px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.ps-stage-chev{font-size:10px;color:var(--txt3);transition:transform var(--t)}
.ps-stage:not([open]) .ps-stage-chev{transform:rotate(-90deg)}
.ps-stage-body{padding:8px 0 2px 28px;font-size:12.5px;color:var(--txt2);line-height:1.65}
.ps-tags{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
.ps-chip{display:inline-block;padding:2px 8px;background:var(--bg3);border-radius:var(--r-full);
  font-size:11.5px;color:var(--txt2)}
.ps-chip.status-selected{background:var(--bg-accent-subtle);color:var(--txt-accent);border:1px solid var(--border-accent)}
.ps-chip.status-candidate{background:var(--bg3);color:var(--txt3);border:1px solid var(--border)}
.ps-rewritten{display:flex;gap:6px;padding:3px 0 6px;border-bottom:1px solid var(--border);margin-bottom:4px}
.ps-rewritten-text{font-size:13px;color:var(--txt);line-height:1.5}
.ps-kv{display:flex;gap:6px;padding:2px 0}
.ps-kv.ps-kv-block{flex-direction:column;gap:2px;padding:4px 0}
.ps-kv-label{font-weight:600;color:var(--txt3);min-width:60px;font-size:12px}
.ps-kv-val{color:var(--txt2);font-size:12.5px}
.ps-ref-list{margin:2px 0 0;padding-left:16px;list-style:disc;color:var(--txt2);font-size:12px;line-height:1.6}
.ps-ref-list li{padding:1px 0}
.ps-inference{padding:4px 0;display:flex;align-items:flex-start;gap:6px}
.ps-inf-icon{color:var(--txt-accent);flex-shrink:0;font-size:11px;margin-top:1px}
.ps-inf-text{font-size:12.5px;color:var(--txt2)}
.ps-inf-val{font-weight:600;color:var(--txt)}
.ps-assumption{padding:3px 0;font-size:12px;color:var(--txt3);font-style:italic}
.ps-notice{margin-top:8px;padding:6px 10px;background:var(--bg-accent-subtle);border-radius:var(--r-xs);
  font-size:12px;color:var(--txt-accent);font-style:italic}
.ps-row-label{margin-top:4px;font-size:13px;font-weight:600;color:var(--txt)}
.ps-sql-fold{margin-bottom:8px}
.ps-sql-summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--txt-accent);padding:4px 0}
.ps-sql-summary:hover{text-decoration:underline}
.ps-sql-code{margin:6px 0 0;padding:10px 0;background:transparent;font-size:11.5px;line-height:1.5;overflow-x:auto;white-space:pre-wrap;word-break:break-word}
.ps-table-row{display:flex;align-items:center;gap:6px;padding:3px 0;flex-wrap:wrap}
.ps-table-reason{font-size:12px;color:var(--txt3)}
.ps-rejected-list{font-size:12px;color:var(--txt3);line-height:1.7}
.ps-more-wrap{position:relative}
.ps-more-wrap.collapsed::after{content:'';position:absolute;bottom:0;left:0;right:0;
  height:40px;background:linear-gradient(transparent,var(--bg2));pointer-events:none}
.ps-toggle-more{display:inline-flex;align-items:center;gap:4px;
  font-size:12px;color:var(--txt-accent);cursor:pointer;padding:4px 0;
  background:none;border:none;font-weight:500}
.ps-toggle-more:hover{text-decoration:underline}

/* ══ Scroll to bottom button ══ */
.scroll-bottom-btn{
  position:sticky;bottom:12px;left:50%;transform:translateX(-50%);
  width:36px;height:36px;border-radius:50%;
  background:var(--bg);border:1px solid var(--border);box-shadow:var(--sh-sm);
  display:none;align-items:center;justify-content:center;
  cursor:pointer;z-index:10;color:var(--txt2);
  transition:opacity var(--t),background var(--t)
}
.scroll-bottom-btn:hover{background:var(--bg2);border-color:var(--border2)}
@media(max-width:640px){.scroll-bottom-btn{width:32px;height:32px}}

/* ══ Chart Modal ══ */
.chart-modal{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);
  z-index:200;display:flex;align-items:center;justify-content:center;animation:fadeUp .2s var(--ease)}
.chart-modal-inner{background:var(--bg);border-radius:var(--r-lg);padding:16px;
  width:90vw;max-width:900px;max-height:90vh;overflow:auto;box-shadow:var(--sh-md)}
.chart-modal-close{float:right;width:32px;height:32px;border:none;background:var(--bg3);
  color:var(--txt2);border-radius:var(--r-xs);cursor:pointer;font-size:16px;
  display:flex;align-items:center;justify-content:center}
.chart-modal-close:hover{background:var(--border2);color:var(--txt)}
.chart-modal-body{text-align:center;padding:8px 0}
.chart-modal-body svg{max-width:100%;height:auto}

/* ══ Mobile ══ */
@media(max-width:640px){
  .sidebar{position:fixed;left:0;top:0;height:100%;transform:translateX(-100%);transition:transform var(--t)}
  .sidebar.mobile-open{transform:translateX(0)}
  .sidebar.collapsed{transform:translateX(-100%)}
  .chat-inner{padding:14px 12px 8px}
  .in-area{padding:8px 12px 14px}
  .starter-grid{grid-template-columns:1fr}
  .message-row.user{padding-left:32px}
  .msg-content{max-width:94%}
  .message-row.assistant .msg-content{width:94%}
}

/* ══ Sidebar chat-item tooltip ══ */
.tip{position:fixed;z-index:9999;max-width:220px;padding:6px 10px;border-radius:8px;
  font-size:12px;line-height:1.5;color:#fff;background:rgba(30,30,30,.92);
  box-shadow:0 2px 8px rgba(0,0,0,.18);white-space:normal;word-break:break-word;
  pointer-events:none;animation:tipIn .15s ease}
@keyframes tipIn{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:translateY(0)}}

/* ══ Sidebar item more-menu ══ */
.chat-item-more{flex-shrink:0;width:22px;height:22px;border:none;background:none;color:var(--txt3);padding:0;
  border-radius:var(--r-xs);display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all var(--t);opacity:0;pointer-events:none}
.chat-item:hover .chat-item-more{opacity:1;pointer-events:auto}
.chat-item-more:hover{background:var(--bg3);color:var(--txt)}
.chat-item-menu{position:fixed;z-index:9999;
  min-width:120px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-sm);
  box-shadow:0 4px 12px rgba(0,0,0,.12);padding:4px 0;display:none}
.chat-item-menu.open{display:block}
.chat-item-menu-item{display:flex;align-items:center;gap:8px;width:100%;padding:7px 12px;
  border:none;background:none;font-size:12.5px;color:var(--txt2);cursor:pointer;transition:all var(--t)}
.chat-item-menu-item:hover{background:var(--bg3);color:var(--txt)}
.chat-item-menu-item.danger:hover{background:var(--bg-accent-subtle);color:#991b1b}
[data-theme="dim"] .chat-item-menu-item.danger:hover,[data-theme="dark"] .chat-item-menu-item.danger:hover{color:#f87171}

/* ══ Insight toggle active ══ */
.act-btn.insight-open{background:var(--bg-accent-subtle);color:var(--txt-accent)}

/* ══ Mobile sidebar backdrop ══ */
.sb-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:19;transition:opacity var(--t)}
@media(max-width:640px){.sb-backdrop.show{display:block}}

/* ══ Like/Dislike ══ */
.act-btn.liked svg,.act-btn.disliked svg{fill:var(--txt);stroke:var(--txt)}
.act-btn.like-btn:hover svg,.act-btn.dislike-btn:hover svg{fill:var(--txt2);stroke:var(--txt2)}

/* ══ Error/Gap turns ══ */
.msg-bubble.error-bubble{background:var(--bg-accent-subtle);border-left:3px solid #ef4444;padding:12px 16px;border-radius:var(--r-sm);color:var(--txt2);font-size:13px}
.msg-bubble.gap-bubble{background:var(--bg2);border:1px dashed var(--border2);padding:10px 14px;border-radius:var(--r-sm);color:var(--txt3);font-size:12.5px;text-align:center;font-style:italic}

/* ══ Timestamp ══ */
.msg-time{font-size:11px;color:var(--txt3);margin-top:4px;display:block}
.msg-time-slot{flex:1;text-align:right;font-size:11px;color:var(--txt3);white-space:nowrap}

/* ══ Sidebar date groups / search / empty / skeleton ══ */
.sb-date-group{padding:8px 13px 3px;font-size:10.5px;font-weight:600;color:var(--txt3);letter-spacing:.04em}
.sb-search{width:calc(100% - 18px);margin:4px 9px;padding:6px 10px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-sm);font-size:12.5px;color:var(--txt);outline:none}
.sb-search:focus{border-color:var(--bg-accent)}
.sb-empty{padding:20px 16px;text-align:center;color:var(--txt3);font-size:13px}
.chat-item.skeleton{pointer-events:none}
.skeleton-bar{height:12px;background:var(--bg3);border-radius:4px;animation:shimmer 1.5s infinite}
@keyframes shimmer{0%{opacity:.4}50%{opacity:.8}100%{opacity:.4}}

/* ══ Sidebar inline edit ══ */
.chat-item-edit{flex:1;min-width:0;padding:2px 6px;background:var(--bg);border:1px solid var(--bg-accent);border-radius:var(--r-xs);font-size:13px;color:var(--txt);outline:none;font-family:var(--sans)}

/* ══ Feedback popup ══ */
.feedback-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:1000;display:flex;align-items:center;justify-content:center}
.feedback-popup{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-md);padding:20px;width:min(360px,90vw);box-shadow:0 8px 32px rgba(0,0,0,.15)}
.feedback-popup h4{margin:0 0 12px;font-size:14px;color:var(--txt)}
.feedback-option{display:block;width:100%;padding:8px 12px;margin:4px 0;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--bg);color:var(--txt);font-size:13px;cursor:pointer;text-align:left}
.feedback-option:hover{background:var(--bg2);border-color:var(--bg-accent)}
.feedback-option.selected{background:var(--bg-accent);color:#fff;border-color:var(--bg-accent)}
.feedback-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.feedback-actions button{padding:6px 16px;border-radius:var(--r-sm);font-size:13px;cursor:pointer}
.feedback-skip{background:none;border:1px solid var(--border);color:var(--txt3)}
.feedback-submit{background:var(--bg-accent);border:none;color:#fff}
.feedback-text-input{width:100%;margin-top:6px;padding:6px 10px;border:1px solid var(--border);border-radius:var(--r-sm);font-size:13px;color:var(--txt);background:var(--bg);outline:none;font-family:var(--sans)}
.feedback-text-input:focus{border-color:var(--bg-accent)}

/* ══ Clarification card (inline, same visual tone as .feedback-popup) ══ */
.clarification-card{background:var(--bg);border:1px solid var(--border);border-left:4px solid var(--bg-accent);
  border-radius:var(--r-md);padding:16px;margin-top:8px;width:min(300px,80vw)}
.clarification-card h4{margin:0 0 8px;font-size:13px;color:var(--txt);font-weight:600}
.clarification-card .clar-option{display:block;width:100%;padding:7px 10px;margin:3px 0;
  border:1px solid var(--border);border-radius:var(--r-sm);background:var(--bg);color:var(--txt);
  font-size:12.5px;cursor:pointer;text-align:left;transition:all var(--t-fast)}
.clarification-card .clar-option:hover{background:var(--bg2);border-color:var(--bg-accent)}
.clarification-card .clar-option.selected{background:var(--bg-accent);color:#fff;border-color:var(--bg-accent)}
.clarification-card .clar-free-input{width:100%;margin-top:5px;padding:5px 9px;border:1px solid var(--border);
  border-radius:var(--r-sm);font-size:12.5px;color:var(--txt);background:var(--bg);outline:none;font-family:var(--sans);display:none}
.clarification-card .clar-free-input:focus{border-color:var(--bg-accent)}
.clarification-card .clar-free-input.visible{display:block}
.clarification-card .clar-actions{display:flex;justify-content:flex-end;margin-top:12px}
.clarification-card .clar-submit{padding:5px 14px;border-radius:var(--r-sm);font-size:12.5px;cursor:pointer;
  background:var(--bg-accent);border:none;color:#fff;transition:background var(--t-fast)}
.clarification-card .clar-submit:hover{background:var(--bg-accent-hover)}
.clarification-card .clar-submit:disabled{opacity:.5;cursor:not-allowed}
.clarification-card[data-submitting="1"]{opacity:.7;pointer-events:none}

/* ══ Undo toast ══ */
.toast-undo{cursor:pointer;text-decoration:underline;margin-left:8px;font-weight:600;color:var(--bg-accent)}

/* ══ Offline banner ══ */
.offline-banner{background:#fef3c7;color:#92400e;padding:8px 16px;text-align:center;font-size:13px;display:none}
.offline-banner.visible{display:block}
[data-theme="dim"] .offline-banner{background:#78350f;color:#fcd34d}
[data-theme="dark"] .offline-banner{background:#451a03;color:#fcd34d}

/* ══ Mobile chart ══ */
@media(max-width:640px){.viz-body svg{max-height:200px}.viz-mobile-btn{display:block;padding:8px;text-align:center;color:var(--bg-accent);font-size:13px;cursor:pointer}}

/* ══ Error turn footer (retry + timestamp on one row) ══ */
.error-footer{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.retry-btn{padding:4px 12px;font-size:12px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r-full);color:var(--txt2);cursor:pointer;font-weight:500;transition:all var(--t-fast)}
.retry-btn:hover{background:var(--bg-accent-subtle);color:var(--txt-accent);border-color:var(--border-accent)}

/* ══ Load more button ══ */
.sb-load-more{display:block;width:calc(100% - 18px);margin:4px 9px;padding:6px;text-align:center;font-size:12px;color:var(--txt-accent);background:none;border:1px solid var(--border);border-radius:var(--r-sm);cursor:pointer;transition:all var(--t)}
.sb-load-more:hover{background:var(--bg3);border-color:var(--border2)}
</style>

/* ═══════════════════════════════════════
   1. TM — Theme Manager (light → dim → dark)
   ═══════════════════════════════════════ */
var TM=(function(){
  var K='dc-theme';
  function init(){
    try{var s=localStorage.getItem(K);if(s){ap(s);return;}}catch(e){}
    ap(matchMedia('(prefers-color-scheme:dark)').matches?'dim':'light');
    matchMedia('(prefers-color-scheme:dark)').addEventListener('change',function(e){
      var sv=null;try{sv=localStorage.getItem(K);}catch(x){}
      if(!sv)ap(e.matches?'dim':'light');
    });
  }
  function ap(t){
    document.documentElement.setAttribute('data-theme',t);
    var isDark=t==='dark'||t==='dim';
    try{
      document.getElementById('hljs-light').disabled=isDark;
      document.getElementById('hljs-dark').disabled=!isDark;
    }catch(e){}
  }
  function get(){return document.documentElement.getAttribute('data-theme')||'light';}
  function set(t){ap(t);try{localStorage.setItem(K,t);}catch(e){}}
  function toggle(){var c=get();set(c==='light'?'dim':c==='dim'?'dark':'light');}
  return{init:init,get:get,set:set,toggle:toggle};
})();

/* ═══════════════════════════════════════
   1b. API — REST API Client
   ═══════════════════════════════════════ */
var API=(function(){
  var BASE='/api';
  async function request(method,path,body){
    var opts={method:method,headers:{'Content-Type':'application/json'}};
    if(body)opts.body=JSON.stringify(body);
    var res=await fetch(BASE+path,opts);
    if(!res.ok){
      var err=await res.json().catch(function(){return{detail:res.statusText};});
      throw{status:res.status,detail:err.detail||res.statusText};
    }
    return res.json();
  }
  return{
    getSessions:function(userId,limit,offset){return request('GET','/sessions?user_id='+(userId||'anonymous')+'&limit='+(limit||20)+'&offset='+(offset||0));},
    getSession:function(sessionId){return request('GET','/sessions/'+sessionId);},
    getSessionActive:function(sessionId){return request('GET','/sessions/'+sessionId+'/active');},
    deleteSession:function(sessionId){return request('DELETE','/sessions/'+sessionId);},
    unarchiveSession:function(sessionId){return request('PATCH','/sessions/'+sessionId+'/unarchive');},
    updateTitle:function(sessionId,title){return request('PATCH','/sessions/'+sessionId+'/title',{title:title});},
    getTurnMeta:function(turnId){return request('GET','/messages/'+turnId+'/metadata');},
    toggleLike:function(turnId,isLiked,feedback){return request('PATCH','/messages/'+turnId+'/like',{is_liked:isLiked,feedback:feedback||null});},
    markDownload:function(turnId){return request('PATCH','/messages/'+turnId+'/download');},
    cancelPipeline:function(sessionId){return request('POST','/sessions/'+sessionId+'/cancel');}
  };
})();

/* ═══════════════════════════════════════
   2. MS — Message Store
   ═══════════════════════════════════════ */
var MS=(function(){
  var _m=new Map(),_n=0,SK='dc-hist';
  function create(role,text,x){
    x=x||{};
    var id='msg-'+Date.now()+'-'+ ++_n;
    var msg={id:id,role:role,text:text||'',status:x.status||'done',
      progress:x.progress||[],visualization:x.visualization||null,
      showThinking:x.showThinking||false,thinkingLabel:x.thinkingLabel||'',
      progressCollapsed:false,progressStartTime:null,progressElapsed:null,
      insight:x.insight||null,downloadReady:x.downloadReady||null,
      resultData:x.resultData||null,processSummary:x.processSummary||null,traceFiles:x.traceFiles||[],
      timestamp:Date.now(),
      /* ── conversation history fields ── */
      turnId:x.turnId||null,
      turnType:x.turnType||null,
      isLiked:x.isLiked!==undefined?x.isLiked:null,
      feedback:x.feedback||null,
      isDownloaded:x.isDownloaded||false,
      hasMetadata:x.hasMetadata||false,
      createdAt:x.createdAt||null,
      restored:x.restored||false,
      clarification:x.clarification||null};
    _m.set(id,msg);_persist();return msg;
  }
  function get(id){return _m.get(id)||null;}
  function update(id,p){var m=_m.get(id);if(!m)return null;Object.assign(m,p);return m;}
  function clear(){_m.clear();_n=0;_persist();}
  function allMessages(){return Array.from(_m.values());}
  function findByTurnId(turnId){
    if(!turnId)return null;
    var arr=allMessages();
    for(var i=0;i<arr.length;i++){if(arr[i].turnId===turnId)return arr[i];}
    return null;
  }
  function _persist(){
    try{var d=allMessages().filter(function(m){return m.role==='user'||(m.role==='assistant'&&m.text);})
      .map(function(m){return{role:m.role,text:m.text,time:m.timestamp};});
      sessionStorage.setItem(SK,JSON.stringify(d));
    }catch(e){}
  }
  function remove(id){_m.delete(id);_persist();}
  return{create:create,get:get,update:update,remove:remove,clear:clear,allMessages:allMessages,findByTurnId:findByTurnId};
})();

/* ═══════════════════════════════════════
   3. RD — Renderer (Markdown 지원)
   ═══════════════════════════════════════ */
var RD=(function(){
  function _lsPref(k,d){try{return localStorage.getItem(k)||d;}catch(e){return d;}}
  function chat(){return document.getElementById('chatContainer');}
  function showWel(){var w=document.getElementById('welcomeScreen');if(w)w.style.display='';}
  function hideWel(){var w=document.getElementById('welcomeScreen');if(w)w.style.display='none';}
  function clearChat(){
    chat().querySelectorAll('.message-row,.status-banner').forEach(function(r){r.remove();});
    showWel();
  }
  function ensureDOM(msg){
    var row=chat().querySelector('[data-id="'+msg.id+'"]');
    if(row)return row;
    hideWel();
    row=document.createElement('div');
    row.className='message-row '+msg.role;
    row.dataset.id=msg.id;
    /* ── Error turn ── */
    if(msg.role==='assistant'&&(msg.status==='failure'||msg.turnType==='error')){
      var errText=msg.text||'오류가 발생했습니다.';
      if(msg.status==='timeout')errText=msg.text||'처리 시간이 초과되었습니다.';
      else if(msg.status==='cancelled')errText=msg.text||'요청이 취소되었습니다.';
      row.innerHTML='<div class="msg-content"><div class="msg-bubble error-bubble">'+esc(errText)+'</div>'
        +'<div class="error-footer"><button class="retry-btn" data-retry="'+msg.id+'">다시 시도</button>'
        +(msg.restored&&msg.createdAt?'<span class="msg-time" style="margin:0">'+_fmtTime(msg.createdAt)+'</span>':'')
        +'</div></div>';
      row.querySelector('.retry-btn').addEventListener('click',function(){
        var msgs=MS.allMessages();
        for(var i=msgs.length-1;i>=0;i--){
          if(msgs[i].id===msg.id){
            for(var j=i-1;j>=0;j--){
              if(msgs[j].role==='user'){ED.resetCancel();if(!CN.send(msgs[j].text)){RD.showBanner('error','서버에 연결되어 있지 않습니다.');return;}IC2.setBusy(true);ED.startBusyTimer();return;}
            }
          }
        }
      });
      chat().appendChild(row);return row;
    }
    /* ── Gap turn ── */
    if(msg.turnType==='gap'){
      row.className='message-row system';
      row.innerHTML='<div class="msg-content" style="margin:0 auto"><div class="msg-bubble gap-bubble">'+esc(msg.text||'응답이 기록되지 않았습니다.')+'</div></div>';
      chat().appendChild(row);return row;
    }
    if(msg.role==='assistant'){
      row.innerHTML='<div class="msg-content">'
        +'<div class="thinking-slot"></div><div class="progress-block-slot"></div>'
        +'<div class="msg-bubble bot-bubble"></div>'
        +'<div class="viz-slot"></div>'
        +'<div class="result-data-slot"></div><div class="process-summary-slot"></div>'
        +'<div class="msg-actions">'
        +'<button class="act-btn" data-act="copy" title="복사">'+ICOPY+'</button>'
        +'<button class="act-btn" data-act="regen" title="재생성">'+IREGEN+'</button>'
        +'<button class="act-btn" data-act="insight" title="분석 과정 보기" style="display:none">💡</button>'
        +'<button class="act-btn" data-act="download-trace" title="분석 리포트" style="display:none"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg></button>'
        +'<button class="act-btn like-btn" data-act="like" data-msg="'+msg.id+'" title="좋아요">'+ITHUMBUP+'</button>'
        +'<button class="act-btn dislike-btn" data-act="dislike" data-msg="'+msg.id+'" title="싫어요">'+ITHUMBDOWN+'</button>'
        +'<span class="msg-time-slot"></span>'
        +'</div>'
        +'<div class="insight-slot"></div>'
        +'<div class="ai-logo">'+CS+'</div>'
        +'</div>';
      /* ── Restore like state ── */
      if(msg.isLiked===true){row.querySelector('.like-btn').classList.add('liked');}
      else if(msg.isLiked===false){row.querySelector('.dislike-btn').classList.add('disliked');}
      /* ── Unified event delegation on msg-actions ── */
      var actions=row.querySelector('.msg-actions');
      if(actions){
        actions.addEventListener('click',function(e){
          var btn=e.target.closest('.act-btn');if(!btn)return;
          var act=btn.dataset.act;
          if(act==='copy'){
            var raw=row.querySelector('.bot-bubble');
            if(raw)navigator.clipboard.writeText(raw._rawText||raw.textContent).then(function(){toast('복사됨');}).catch(function(){toast('복사 실패');});
          }else if(act==='regen'){App.regen();}
          else if(act==='insight'){_onInsightClick(msg.id,row,btn);}
          else if(act==='download-trace'){_onTraceDownload(msg,btn);}
          else if(act==='like'||act==='dislike'){_onLikeClick(msg.id,act);}
        });
      }
    }else if(msg.role==='system'){
      row.innerHTML='<div class="msg-content" style="margin:0 auto"><div class="msg-bubble system-bubble"></div></div>';
    }else{
      row.innerHTML='<div class="msg-content" style="margin-left:auto"><div class="msg-bubble user-bubble"></div>'
        +(msg.restored&&msg.createdAt?'<span class="msg-time">'+_fmtTime(msg.createdAt)+'</span>':'')
        +'</div>';
    }
    chat().appendChild(row);
    return row;
  }
  function _fmtTime(ts){
    if(!ts)return '';
    var d=new Date(ts);
    if(isNaN(d.getTime()))return '';
    return d.getFullYear()+'.'
      +String(d.getMonth()+1).padStart(2,'0')+'.'
      +String(d.getDate()).padStart(2,'0')+' '
      +String(d.getHours()).padStart(2,'0')+':'
      +String(d.getMinutes()).padStart(2,'0');
  }
  /* ── Insight click: lazy-load metadata for restored messages ── */
  async function _onInsightClick(msgId,row,btn){
    var msg=MS.get(msgId);if(!msg)return;
    /* Already loaded — just toggle */
    var slot=row.querySelector('.insight-slot');
    if(!slot)return;
    /* Already loaded — toggle only if panel has real content */
    if(msg.insight){
      if(slot.children.length){slot.classList.toggle('open');btn.classList.toggle('insight-open');}
      return;
    }
    /* Restored message with metadata available — lazy load */
    if(msg.restored&&msg.hasMetadata&&msg.turnId){
      /* Show loading indicator */
      slot.innerHTML='<div class="insight-panel"><span class="thinking-label">분석 과정 불러오는 중\u2026</span></div>';
      slot.classList.add('open');btn.classList.add('insight-open');
      try{
        var resp=await API.getTurnMeta(msg.turnId);
        var meta=resp.metadata||{};
        if(meta.insight){
          MS.update(msgId,{insight:meta.insight});
          /* Clear loading indicator so renderInsight's guard doesn't block */
          slot.innerHTML='';
          renderInsight(row,MS.get(msgId));
        }
        if(meta.visualization){var nv=VIZ.normalize(meta.visualization);if(nv){MS.update(msgId,{visualization:nv});renderViz(row,nv);}}
        if(meta.sql_result)MS.update(msgId,{downloadReady:meta.sql_result});
        /* No insight found — clear loading and close slot */
        if(!meta.insight){slot.innerHTML='';slot.classList.remove('open');btn.classList.remove('insight-open');}
      }catch(e){
        slot.innerHTML='<div class="insight-panel"><span style="color:var(--txt3)">상세 정보를 불러올 수 없습니다.</span></div>';

  /* ── Like/Dislike 3-state + feedback popup ── */
  function _onLikeClick(msgId,action){
    var msg=MS.get(msgId);if(!msg)return;
    var prev=msg.isLiked;
    var next;
    if(action==='like'){next=prev===true?null:true;}
    else{next=prev===false?null:false;}
    /* If toggling off (going to null), just save immediately */
    if(next===null){
      _applyLike(msgId,next,null);
      return;
    }
    /* Show feedback popup for both like and dislike */
    _showFeedbackPopup(next,function(feedback){
      _applyLike(msgId,next,feedback);
    });
  }
  function _applyLike(msgId,newState,feedback){
    var msg=MS.get(msgId);if(!msg)return;
    var prevState=msg.isLiked;var prevFeedback=msg.feedback;
    MS.update(msgId,{isLiked:newState,feedback:feedback});
    _updateLikeButtons(msgId,newState);
    if(!msg.turnId){return;}
    API.toggleLike(msg.turnId,newState,feedback).then(function(){
      if(newState!==null)toast('피드백이 기록되었습니다');
    }).catch(function(){
      MS.update(msgId,{isLiked:prevState,feedback:prevFeedback});
      _updateLikeButtons(msgId,prevState);
      toast('평가를 저장할 수 없습니다.');
    });
  }
  function _updateLikeButtons(msgId,state){
    var row=chat().querySelector('[data-id="'+msgId+'"]');if(!row)return;
    var lb=row.querySelector('.like-btn'),db=row.querySelector('.dislike-btn');
    if(!lb||!db)return;
    lb.classList.remove('liked');db.classList.remove('disliked');
    if(state===true)lb.classList.add('liked');
    else if(state===false)db.classList.add('disliked');
  }
  function _showFeedbackPopup(isLiked,callback){
    var root=document.getElementById('feedbackRoot');
    var likeOptions=['정확한 데이터','유용한 분석','빠른 응답','기타'];
    var dislikeOptions=['잘못된 데이터','SQL이 의도와 다름','응답이 불친절함','기타'];
    var options=isLiked?likeOptions:dislikeOptions;
    var title=isLiked?'어떤 점이 좋으셨나요? (선택)':'어떤 점이 아쉬우셨나요? (선택)';
    var selected=null,customText='';
    var overlay=document.createElement('div');overlay.className='feedback-overlay';
    var popup=document.createElement('div');popup.className='feedback-popup';
    var h='<h4>'+esc(title)+'</h4>';
    options.forEach(function(o,i){h+='<button class="feedback-option" data-idx="'+i+'">'+esc(o)+'</button>';});
    h+='<div class="feedback-actions"><button class="feedback-skip">취소</button><button class="feedback-submit">제출</button></div>';
    popup.innerHTML=h;
    overlay.appendChild(popup);root.appendChild(overlay);
    var textInput=null;
    popup.querySelectorAll('.feedback-option').forEach(function(btn){
      btn.addEventListener('click',function(){
        popup.querySelectorAll('.feedback-option').forEach(function(b){b.classList.remove('selected');});
        btn.classList.add('selected');selected=options[parseInt(btn.dataset.idx)];
        /* Show text input for "기타" */
        if(selected==='기타'){
          if(!textInput){
            textInput=document.createElement('input');textInput.className='feedback-text-input';
            textInput.placeholder='의견을 입력해주세요…';
            btn.after(textInput);textInput.focus();
            textInput.addEventListener('input',function(){customText=textInput.value;});
          }
        }else{
          if(textInput){textInput.remove();textInput=null;customText='';}
        }
      });
    });
    popup.querySelector('.feedback-skip').addEventListener('click',function(){overlay.remove();callback(null);});
    popup.querySelector('.feedback-submit').addEventListener('click',function(){
      var fb=selected==='기타'&&customText?customText:selected;
      overlay.remove();callback(fb||null);
    });
    overlay.addEventListener('click',function(e){if(e.target===overlay){overlay.remove();callback(null);}});
  }
  function render(msg){

        mc.querySelector('.error-footer').appendChild(trBtn2);
        trBtn2.addEventListener('click',function(){_onTraceDownload(msg,trBtn2);});
      }
      mc.querySelector('.retry-btn').addEventListener('click',function(){
        var msgs=MS.allMessages();
        for(var i=msgs.length-1;i>=0;i--){
          if(msgs[i].id===msg.id){
            for(var j=i-1;j>=0;j--){
              if(msgs[j].role==='user'){ED.resetCancel();if(!CN.send(msgs[j].text)){RD.showBanner('error','서버에 연결되어 있지 않습니다.');return;}IC2.setBusy(true);ED.startBusyTimer();return;}
            }
          }
        }
      });
      autoScroll();return;
    }
    if(msg.role==='assistant'){
      if(msg.status==='streaming'){
        bub.innerHTML=mdRender(msg.text)+'<span class="streaming-cursor"></span>';
      }else{
        bub.innerHTML=mdRender(msg.text);
        bub._rawText=msg.text;
        if(msg.text){attachCodeCopy(bub);_wrapRefBlocks(bub);}
      }
      /* ── Clarification turn: 카드 또는 레거시 텍스트 ── */
      if(msg.restored&&msg.turnType==='clarification'){
        if(msg.clarification){
          bub.style.display='none';
          _renderClarification(row,msg);
        }
      }
    }else{
      if(msg.status==='streaming'){
        bub.innerHTML=esc(msg.text)+'<span class="streaming-cursor"></span>';
      }else{
        bub.textContent=msg.text;
      }
    }
    bub.style.display=(!msg.text&&msg.showThinking)?'none':(msg.restored&&msg.turnType==='clarification'&&msg.clarification)?'none':'';
    if(msg.role!=='assistant'){autoScroll();return;}
    /* AI 로고: 마지막 assistant 메시지에만 표시 */
    chat().querySelectorAll('.ai-logo.visible,.ai-logo.thinking,.ai-logo.streaming').forEach(function(l){l.classList.remove('visible','thinking','streaming');});
    var logo=row.querySelector('.ai-logo');
    if(logo){
      logo.classList.add('visible');
      if(msg.showThinking&&!msg.text)logo.classList.add('thinking');
      else if(msg.status==='streaming')logo.classList.add('streaming');
    }
    renderTh(row,msg);
    renderPB(row,msg);
    try{renderResultTable(row,msg);}catch(e){console.error('[renderResultTable]',e);}
    try{renderProcessSummary(row,msg);}catch(e){console.error('[renderProcessSummary]',e);}
    if(msg.visualization){try{renderViz(row,msg.visualization);}catch(e){console.error('[renderViz]',e);}}
    /* insight 전구 버튼: 실시간 insight 있거나, 복원된 메시지에 metadata 있으면 표시 */
    var ib=row.querySelector('[data-act="insight"]');
    if(ib){
      if(msg.insight||msg.hasMetadata){ib.removeAttribute('style');}
      if(msg.insight){try{renderInsight(row,msg);}catch(e){console.error('[renderInsight]',e);}}

    /* trace 다운로드 버튼 활성화 */
    var trBtn=row.querySelector('[data-act="download-trace"]');
    if(trBtn){if(msg.traceFiles&&msg.traceFiles.length)trBtn.removeAttribute('style');else trBtn.style.display='none';}
    /* timestamp: 응답 완료 시 msg-actions 우측에 표시 (DB status는 'success') */
    var tSlot=row.querySelector('.msg-time-slot');
    if(tSlot&&(msg.status==='done'||msg.status==='success')){
      var ts=msg.createdAt||msg.timestamp;
      if(ts&&!tSlot.textContent)tSlot.textContent=_fmtTime(ts);
    }
    autoScroll();
  }
  function renderTh(row,msg){
    var slot=row.querySelector('.thinking-slot');

      slot.innerHTML='<div class="thinking-indicator">'

  var PHASE_ORDER=['interpret','reason','present'];
  var PHASE_TAGS={interpret:'Interpret',reason:'Reason',present:'Present'};
  function _groupByPhase(steps){
    var groups={},order=[];
    steps.forEach(function(s){
      var p=s.phase||'_default';
      if(!groups[p]){groups[p]={phase:p,phaseLabel:s.phaseLabel||p,steps:[]};order.push(p);}
      groups[p].steps.push(s);
    });
    /* PHASE_ORDER 기준 정렬, 없는 phase는 끝에 */
    var sorted=[];
    PHASE_ORDER.forEach(function(p){if(groups[p])sorted.push(groups[p]);});
    order.forEach(function(p){if(PHASE_ORDER.indexOf(p)===-1)sorted.push(groups[p]);});
    return sorted;
  }
  function _phaseStatus(group){
    var hasActive=group.steps.some(function(s){return s.status==='active';});
    var allDone=group.steps.every(function(s){return s.status==='done';});
    return hasActive?'active':allDone?'done':'pending';
  }
  function _renderPhaseHTML(groups,collapsed,msg){
    return groups.map(function(g){
      var st=_phaseStatus(g);
      var tag=PHASE_TAGS[g.phase]||g.phase;
      var statusIcon=st==='done'?IC:st==='active'?IS:'';
      var isExpanded=msg&&msg.phaseExpanded&&msg.phaseExpanded[g.phase];
      var innerCls='phase-steps-inner'+(isExpanded?' expanded':'');
      var h='<div class="progress-phase '+st+'">'
        +'<div class="phase-header"><span class="phase-tag">'+esc(tag)+'</span>'
        +'<span class="phase-label">'+esc(g.phaseLabel)+'</span>';
      if(statusIcon)h+='<span class="phase-status-icon">'+statusIcon+'</span>';
      if(g.steps.length)h+='<span class="phase-chevron">'+IV+'</span>';
      h+='</div>';
      if(g.steps.length){
        var STEP_LIMIT=6;
        var visibleSteps=g.steps;
        var truncated=false;
        /* 스텝이 많으면 처음 STEP_LIMIT개만 표시 (모든 phase 공통) */
        if(!isExpanded&&g.steps.length>STEP_LIMIT){
          truncated=true;
          visibleSteps=g.steps.slice(0,STEP_LIMIT);
        }
        h+='<div class="phase-steps"><div class="'+innerCls+'">';
        h+=visibleSteps.map(function(s){
            var d=s.status==='done';
            return '<div class="progress-step '+(d?'done':'active')+'">'+(d?'':'<span class="step-icon">'+IS+'</span>')+'<span>'+esc(s.label)+'</span></div>';
          }).join('');
        if(truncated)h+='<div class="phase-steps-fade"></div>';
        h+='</div>';
        /* STEP_LIMIT 초과 시 "더 보기/접기" 버튼 */
        if(g.steps.length>STEP_LIMIT){
          h+='<button class="phase-expand-btn" data-phase="'+g.phase+'">'
            +(isExpanded?'접기':'더 보기 ('+g.steps.length+'단계)')+'</button>';
        }
        h+='</div>';
      }
      h+='</div>';
      return h;
    }).join('');
  }
  function renderPB(row,msg){
    var slot=row.querySelector('.progress-block-slot');
    if(!msg.progress||!msg.progress.length){slot.innerHTML='';return;}
    var groups=_groupByPhase(msg.progress);
    if(msg.progressCollapsed){
      /* 접힌 상태: 요약 한 줄 + 클릭 시 phase별 확장 */
      var block=slot.querySelector('.progress-block');
      if(!block){
        slot.innerHTML='';block=document.createElement('div');block.className='progress-block';
        block.innerHTML='<div class="progress-collapsed-summary"><span class="summary-text"></span><span class="summary-chevron">'+IV+'</span></div><div class="progress-phases" style="display:none"></div>';
        block.querySelector('.progress-collapsed-summary').addEventListener('click',function(){
          block.classList.toggle('expanded');
          var ph=block.querySelector('.progress-phases');
          ph.style.display=block.classList.contains('expanded')?'':'none';
        });
        slot.appendChild(block);
      }
      var lastDone=msg.progress.filter(function(s){return s.status==='done';});
      var label=lastDone.length?lastDone[lastDone.length-1].label:'분석 완료';
      block.querySelector('.summary-text').textContent=label;
      var phasesEl=block.querySelector('.progress-phases');
      phasesEl.innerHTML=_renderPhaseHTML(groups,true,msg);
      /* phase 헤더/더보기 버튼 클릭 이벤트 */
      _bindPhaseEvents(phasesEl,msg);
      return;
    }
    /* 라이브 상태: phase별 계층 표시 */
    var container=slot.querySelector('.progress-phases');
    if(!container){slot.innerHTML='';container=document.createElement('div');container.className='progress-phases';slot.appendChild(container);}
    container.innerHTML=_renderPhaseHTML(groups,false,msg);
    _bindPhaseEvents(container,msg);
  }
  function _bindPhaseEvents(container,msg){
    container.querySelectorAll('.phase-header').forEach(function(ph){
      ph.addEventListener('click',function(){
        var el=ph.parentElement;
        if(el.classList.contains('active'))return;
        el.classList.toggle('expanded');
      });
    });
    container.querySelectorAll('.phase-expand-btn').forEach(function(btn){
      btn.addEventListener('click',function(e){
        e.stopPropagation();
        var phase=btn.dataset.phase;
        msg.phaseExpanded=msg.phaseExpanded||{};
        msg.phaseExpanded[phase]=!msg.phaseExpanded[phase];
        /* phase-steps 영역만 갱신 (phase 확장 상태 유지) */
        var phaseEl=btn.closest('.progress-phase');
        var stepsContainer=phaseEl?phaseEl.querySelector('.phase-steps'):null;
        if(stepsContainer){
          var groups=_groupByPhase(msg.progress);
          var g=groups.filter(function(x){return x.phase===phase;})[0];
          if(g){
            var isExp=msg.phaseExpanded[phase];
            var STEP_LIMIT=6;
            var visibleSteps=g.steps;
            var truncated=false;
            if(!isExp&&g.steps.length>STEP_LIMIT){truncated=true;visibleSteps=g.steps.slice(0,STEP_LIMIT);}
            var inner=stepsContainer.querySelector('.phase-steps-inner');
            if(inner){
              inner.innerHTML=visibleSteps.map(function(s){
                var d=s.status==='done';
                return '<div class="progress-step '+(d?'done':'active')+'">'+(d?'':'<span class="step-icon">'+IS+'</span>')+'<span>'+esc(s.label)+'</span></div>';
              }).join('')+(truncated?'<div class="phase-steps-fade"></div>':'');
            }
            btn.textContent=isExp?'접기':'더 보기 ('+g.steps.length+'단계)';
            return;
          }
        }
        RD.render(msg);
      });
    });
  }

  /* ━━━━━━ 저니 뷰 렌더러 ━━━━━━ */
  function _renderJourneyView(slot,journey){

        tc.forEach(function(call){

          var pgText=call.page?' (page '+call.page+')':'';
          h+='<details class="ij-tool" open>';
          h+='<summary>'+esc(call.label)+': "'+esc(call.query)+'"'+pgText+cntText+'</summary>';
          h+='<div class="ij-tool-body">';
          /* 채택 */
          (call.adopted||[]).forEach(function(item){
            h+='<div class="ij-item adopted">';
            h+='<span class="ij-item-icon">✅</span>';
            h+='<span class="ij-item-name">'+esc(item.name)+'</span>';

            h+='</div>';
          });
          /* 제외 */
          (call.rejected||[]).forEach(function(item){
            h+='<div class="ij-item rejected">';
            h+='<span class="ij-item-icon">❌</span>';
            h+='<span class="ij-item-name">'+esc(item.name)+'</span>';

          }
          h+='</div></details>';
        });
      }

      /* 준비도 판정 */
      if(hypo.readiness){

  function renderInsight(row,msg){
    var slot=row.querySelector('.insight-slot');
    if(!slot||!msg.insight)return;
    if(slot.querySelector('.insight-panel'))return;
    var ins=msg.insight;
    /* ── 저니 뷰 분기 ── */
    if(ins.journey){_renderJourneyView(slot,ins.journey);return;}
    var h='<div class="insight-panel">';
    /* ── 공통: 질문 해석 ── */
    var qi=ins.query_interpretation;
    if(qi){
      h+='<div class="insight-section"><div class="insight-title">📋 질문 해석</div><div class="insight-body">';
      if(qi.period)h+='<div class="insight-row"><span class="insight-key">기간</span>'+esc(qi.period)+'</div>';
      if(qi.target)h+='<div class="insight-row"><span class="insight-key">대상</span>'+esc(qi.target)+'</div>';
      if(qi.metric)h+='<div class="insight-row"><span class="insight-key">지표</span>'+esc(qi.metric)+'</div>';
      h+='</div></div>';
    }
    /* ── 공통: 추론 과정 ── */

      h+='<ol class="insight-trail">';
      ins.reasoning_trail.forEach(function(t){

      });
      h+='</ol></div></div>';
    }
    if(ins.is_success){
      /* ══════ 성공 시 ══════ */
      /* 사용한 테이블 (3분류: used / candidate / rejected) */
      var _tu=ins.tables_used||[],_tc=ins.tables_candidate||[],_tr=ins.tables_rejected||[];
      if(_tu.length||_tc.length||_tr.length){
        var _allTables=[].concat(
          _tu.map(function(t){return{t:t,cls:'used',icon:'✅'};}),

          _tr.map(function(t){return{t:t,cls:'rejected',icon:'❌'};})
        );
        var _TMAX=6;
        var _needFold=_allTables.length>_TMAX;
        h+='<div class="insight-section"><div class="insight-title">🗂️ 사용한 데이터</div><div class="insight-body">';
        if(_needFold)h+='<div class="insight-more-wrap collapsed">';
        _allTables.forEach(function(item,i){
          var t=item.t,label=t.alt_name?esc(t.alt_name)+' ('+esc(t.name)+')':esc(t.name);
          if(i===_TMAX&&_needFold)h+='<div class="insight-more-zone" style="display:none">';
          h+='<div class="insight-table '+item.cls+'"><strong>'+(item.icon?item.icon+' ':'')+label+'</strong>';
          if(t.reason)h+=' <span class="insight-desc">'+esc(t.reason)+'</span>';
          if(t.columns&&t.columns.length)h+='<div class="insight-cols">'+t.columns.map(esc).join(', ')+'</div>';
          h+='</div>';

          h+='</div>';/* close .insight-more-zone */
          h+='</div>';/* close .insight-more-wrap */
