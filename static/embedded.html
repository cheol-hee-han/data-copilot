        }
        h+='</div></div>';
      }
      /* SQL 검증 결과 */
      if(ins.validation_detail&&ins.validation_detail.length){
        h+='<div class="insight-section"><div class="insight-title">✅ SQL 검증 결과</div><div class="insight-body">';
        ins.validation_detail.forEach(function(v){
          h+='<div class="insight-validation-item"><span class="vd-label">'+esc(v.label)+'</span><span>'+esc(v.detail)+'</span></div>';
        });
        /* SQL 접기 — pref-sql-display 설정 반영 */
        if(ins.sql_code){h+=_renderSqlBlock(ins.sql_code);}
        h+='</div></div>';
      }else if(ins.sql_code){
        /* Layer2b 비활성 — 기존 SQL 섹션 fallback */
        h+='<div class="insight-section"><div class="insight-title">🔗 조회 조건</div><div class="insight-body">';
        if(ins.sql_summary)h+='<div class="insight-sql-summary">'+esc(ins.sql_summary)+'</div>';
        if(ins.join_path)h+='<div class="insight-join">'+esc(ins.join_path)+'</div>';
        h+=_renderSqlBlock(ins.sql_code);
        h+='</div></div>';
      }
      /* 참고 자료 */
      if(ins.references&&ins.references.length){
        h+='<div class="insight-section"><div class="insight-title">📚 참고한 자료</div><div class="insight-body">';
        ins.references.forEach(function(r){h+='<div class="insight-ref">• '+esc(r.title)+': '+esc(r.detail)+'</div>';});
        h+='</div></div>';
      }
      /* 신뢰도 */
      var conf=ins.confidence||'보통';
      var cc=conf==='높음'?'high':conf==='보통'?'mid':'low';
      h+='<div class="insight-section"><div class="insight-title">🎯 신뢰도: <span class="insight-conf '+cc+'">'+esc(conf)+'</span></div>';
      if(ins.caveats&&ins.caveats.length){
        h+='<div class="insight-body">';
        ins.caveats.forEach(function(c){h+='<div class="insight-caveat">⚠️ '+esc(c)+'</div>';});
        h+='</div>';
      }
      h+='</div>';
      /* 처리 시간 */
      var _te=parseFloat(ins.total_elapsed);
      if(!isNaN(_te)){
        h+='<div class="insight-section"><div class="insight-title">⏱️ 처리 시간: '+_te.toFixed(1)+'초';
        if(ins.step_timings)h+=' ('+ins.step_timings.length+'단계)';
        h+='</div>';
        if(ins.step_timings&&ins.step_timings.length){
          h+='<details><summary>상세 보기</summary><div class="insight-body">';
          ins.step_timings.forEach(function(s){
            var _se=parseFloat(s.elapsed);h+='<div class="insight-timing"><span>'+esc(s.label)+'</span><span>'+(isNaN(_se)?'-':_se.toFixed(1))+'초</span></div>';
          });
          h+='</div></details>';
        }
        h+='</div>';
      }
    }else{
      /* ══════ 실패 시 ══════ */
      /* 실패 원인 */
      if(ins.failure_narrative){
        h+='<div class="insight-section"><div class="insight-title">❌ 실패 원인</div><div class="insight-body">';
        h+='<div class="insight-failure-box">'+esc(ins.failure_narrative)+'</div>';
        h+='</div></div>';
      }
      /* 시도한 접근 */
      if(ins.dead_end_trail&&ins.dead_end_trail.length){
        h+='<div class="insight-section"><div class="insight-title">🔄 시도한 접근</div><div class="insight-body">';
        ins.dead_end_trail.forEach(function(de,i){
          h+='<div class="insight-deadend">';
          h+='<div class="insight-deadend-type">'+(i+1)+'차 시도';
          if(de.failure_type)h+=' · '+esc(de.failure_type);
          h+='</div>';
          if(de.reason)h+='<div class="insight-deadend-reason">'+esc(de.reason)+'</div>';
          if(de.lessons_learned)h+='<div class="insight-deadend-lesson">교훈: '+esc(de.lessons_learned)+'</div>';
          h+='</div>';
        });
        h+='</div></div>';
      }
    }
    h+='</div>';
    /* 섹션이 하나도 없으면 빈 패널 생성 방지 */
    if(h==='<div class="insight-panel"></div>')return;
    slot.innerHTML=h;
    /* ★ 더 보기/접기 버튼 이벤트 */
    slot.querySelectorAll('.insight-toggle-more').forEach(function(btn){
      var origText=btn.textContent;
      btn.addEventListener('click',function(){
        var wrap=btn.previousElementSibling;
        if(!wrap||!wrap.classList.contains('insight-more-wrap'))return;
        var zone=wrap.querySelector('.insight-more-zone');
        if(!zone)return;
        var visible=zone.style.display!=='none';
        zone.style.display=visible?'none':'';
        wrap.classList.toggle('collapsed',visible);
        btn.textContent=visible?origText:'접기';
      });
    });
    /* ★ SQL 하이라이팅 적용 */
    slot.querySelectorAll('pre code.language-sql').forEach(function(block){
      if(typeof hljs!=='undefined')hljs.highlightElement(block);
    });
  }
  /* ── SQL 표시 설정 반영 (show/fold/hide) ── */
  function _formatSQL(sql){
    try{
      var sf=window.sqlFormatter;
      if(sf&&sf.format){
        return sf.format(sql,{
          language:'postgresql',
          keywordCase:'upper',
          indentStyle:'tabularRight'
        });
      }
    }catch(e){console.warn('[sql-formatter]',e);}
    return sql;
  }
  function _renderSqlBlock(sqlCode){
    var pref;try{pref=localStorage.getItem('pref-sql-display')||'fold';}catch(e){pref='fold';}
    if(pref==='hide')return '';
    var formatted=esc(_formatSQL(sqlCode));
    if(pref==='show')return '<pre style="margin-top:6px"><code class="language-sql">'+formatted+'</code></pre>';
    return '<details style="margin-top:6px"><summary>SQL 보기</summary><pre><code class="language-sql">'+formatted+'</code></pre></details>';
  }
  /* ── renderResultTable: result_data를 테이블로 렌더링 ── */
  function renderResultTable(row,msg){
    if(!msg.resultData)return;
    /* info_card 테이블 중복 방지: 카드와 동일 데이터를 표로 다시 표시하지 않는다 */
    if(msg.visualization&&msg.visualization.chart_type==='info_card')return;
    var slot=row.querySelector('.result-data-slot');
    if(!slot||slot.children.length)return;
    var rd=msg.resultData;
    if(!rd.columns||!rd.columns.length)return;
    var rows=rd.rows||[];
    var cw=document.getElementById('chatWrap');
    var wasAtBottom=(cw.scrollHeight-cw.scrollTop-cw.clientHeight)<50;
    /* rows가 없는 경우 (복원된 메시지) — 컬럼 헤더 + 건수 요약만 표시 */
    if(!rows.length&&!rd.rows){
      var h='<div class="table-wrap"><table><thead><tr>';
      rd.columns.forEach(function(col){h+='<th>'+esc(col)+'</th>';});
      h+='</tr></thead></table>';
      var cnt=rd.total_count||rd.displayed_count||0;
      if(cnt>0)h+='<div class="table-truncated">'+cnt.toLocaleString()+'건 조회 완료 (이전 대화의 조회 결과입니다)</div>';
      else h+='<div class="table-truncated">조회 결과 (이전 대화의 조회 결과입니다)</div>';
      h+='</div>';
      slot.innerHTML=h;
      if(wasAtBottom)cw.scrollTop=cw.scrollHeight;
      return;
    }
    var h='<div class="table-wrap"><table><thead><tr>';
    rd.columns.forEach(function(col){h+='<th>'+esc(col)+'</th>';});
    h+='</tr></thead><tbody>';
    var maxRender=Math.min(rows.length,200);
    for(var i=0;i<maxRender;i++){
      var r=rows[i];if(!r){h+='<tr>';rd.columns.forEach(function(){h+='<td></td>';});h+='</tr>';continue;}
      h+='<tr>';
      rd.columns.forEach(function(col){
        h+='<td>'+_formatCell(r[col],(rd.column_formats||{})[col])+'</td>';
      });
      h+='</tr>';
    }
    h+='</tbody></table>';
    if((rd.total_count||0)>(rd.displayed_count||0)){
      h+='<div class="table-truncated">전체 '+rd.total_count.toLocaleString()+'건 중 '+rd.displayed_count.toLocaleString()+'건 표시</div>';
    }else if(rows.length>maxRender){
      h+='<div class="table-truncated">표시 제한: '+rows.length.toLocaleString()+'건 중 '+maxRender+'건 표시 (전체 데이터는 CSV로 다운로드)</div>';
    }
    h+='</div>';
    slot.innerHTML=h;
    /* CSV 복사 버튼 추가 */
    var tw=slot.querySelector('.table-wrap');
    if(tw){
      var cb=document.createElement('button');cb.className='content-copy';
      cb.innerHTML=ICOPY+(_lsPref('pref-table-copy','tsv')==='tsv'?' TSV 복사':' CSV 복사');
      cb.onclick=function(){
        var tbl=tw.querySelector('table');if(!tbl)return;
        var csv=_tableToCSV(tbl);
        navigator.clipboard.writeText(csv).then(function(){
          cb.innerHTML=IC+' 복사됨';setTimeout(function(){cb.innerHTML=ICOPY+(_lsPref('pref-table-copy','tsv')==='tsv'?' TSV 복사':' CSV 복사');},2000);
        }).catch(function(){toast('복사 실패');});
      };
      tw.appendChild(cb);
    }
    attachCodeCopy(slot);
    if(wasAtBottom)cw.scrollTop=cw.scrollHeight;
  }
  function _formatCell(val,fmt){
    if(val==null||val==='')return '';
    if(typeof val!=='number')return esc(String(val));
    switch(fmt){
      case 'currency':return _formatCurrency(val);
      case 'rate':return val.toFixed(1)+'%';
      case 'count':return val.toLocaleString()+'건';
      default:return val.toLocaleString();
    }
  }
  function _formatCurrency(val){
    var abs=Math.abs(val),sign=val<0?'-':'';
    if(abs>=1e12)return sign+(abs/1e12).toFixed(1)+'조원';
    if(abs>=1e8)return sign+(abs/1e8).toFixed(0)+'억원';
    if(abs>=1e4)return sign+(abs/1e4).toFixed(0)+'만원';
    return sign+abs.toLocaleString()+'원';
  }
  /* ── renderProcessSummary: stream.end의 process_summary를 ref-block으로 렌더링 ── */
  function renderProcessSummary(row,msg){

    var num=0;
    /* ── 1. 의도 파악 ── */
    if(ps.intent){
      num++;
      var it=ps.intent;
      var brief=it.label||(it.is_continuation?'이어서 질의':'새 질의');
      h+=_psStage(num,'의도 파악',brief,function(){

      });
    }
    /* ── 2. 질문 해석 ── */
    if(ps.interpretation&&Object.keys(ps.interpretation).length){
      num++;
      var ip=ps.interpretation;
      var parts=[];
      if(ip.measures)parts.push(ip.measures.join(', '));
      if(ip.period)parts.push(ip.period);
      var brief2=parts.join(' · ')||'해석 완료';
      h+=_psStage(num,'질문 해석',ip.rewritten_query?esc(ip.rewritten_query):brief2,function(){
        var b='';
        if(ip.rewritten_query){b+='<div class="ps-rewritten"><span class="ps-kv-label">AI 질의해석</span><span class="ps-rewritten-text">'+esc(ip.rewritten_query)+'</span></div>';}
        if(ip.measures&&ip.measures.length){b+='<div class="ps-kv"><span class="ps-kv-label">지표</span><span class="ps-kv-val"><span class="ps-tags">'+ip.measures.map(function(m){return '<span class="ps-chip">'+esc(m)+'</span>';}).join('')+'</span></span></div>';}
        if(ip.filters&&ip.filters.length){b+='<div class="ps-kv"><span class="ps-kv-label">조건</span><span class="ps-kv-val"><span class="ps-tags">'+ip.filters.map(function(f){return '<span class="ps-chip">'+esc(f)+'</span>';}).join('')+'</span></span></div>';}
        if(ip.period){b+='<div class="ps-kv"><span class="ps-kv-label">기간</span><span class="ps-kv-val"><span class="ps-chip">'+esc(ip.period)+'</span></span></div>';}
        if(ip.entities&&ip.entities.length){b+='<div class="ps-kv"><span class="ps-kv-label">대상</span><span class="ps-kv-val"><span class="ps-tags">'+ip.entities.map(function(e){return '<span class="ps-chip">'+esc(e)+'</span>';}).join('')+'</span></span></div>';}
        if(ip.dimensions&&ip.dimensions.length){b+='<div class="ps-kv"><span class="ps-kv-label">기준</span><span class="ps-kv-val"><span class="ps-tags">'+ip.dimensions.map(function(d){return '<span class="ps-chip">'+esc(d)+'</span>';}).join('')+'</span></span></div>';}
        return b;
      });
    }
    /* ── 3. 컨텍스트 탐색 ── */
    if(ps.context&&Object.keys(ps.context).length){
      num++;
      var cx=ps.context;
      var cParts=[];
      if(cx.tables)cParts.push('테이블 '+cx.tables.length+'개');
      if(cx.use_cases&&cx.use_cases.length)cParts.push('유사SQL '+cx.use_cases.length+'건');
      if(cx.manuals&&cx.manuals.length)cParts.push('매뉴얼 '+cx.manuals.length+'건');
      var brief3=cParts.join(', ')||'탐색 완료';
      h+=_psStage(num,'컨텍스트 탐색',brief3,function(){
        var b='';
        var _CX_MAX=6,_cxIdx=0,_cxTotal=0,_cxNeedFold=false;
        if(cx.tables)_cxTotal+=cx.tables.length;
        if(cx.rejected_tables)_cxTotal+=cx.rejected_tables.length;
        _cxNeedFold=_cxTotal>_CX_MAX;
        if(_cxNeedFold)b+='<div class="ps-more-wrap collapsed">';
        if(cx.tables&&cx.tables.length){
          var selected=cx.tables.filter(function(t){return t.used;});
          var others=cx.tables.filter(function(t){return !t.used;});
          if(selected.length){
            b+='<div style="margin-bottom:6px"><span class="ps-kv-label">선택된 테이블</span></div>';
            selected.forEach(function(t){
              _cxIdx++;
              if(_cxIdx===_CX_MAX+1&&_cxNeedFold)b+='<div class="ps-more-zone" style="display:none">';
              var display=t.label&&t.label!==t.name?t.label+' ('+t.name+')':t.name;
              var reason=t.reason?' — '+esc(t.reason):'';
              b+='<div class="ps-table-row"><span class="ps-chip status-selected">'+esc(display)+'</span>'
                +'<span class="ps-table-reason">'+reason+'</span></div>';
            });
          }
          if(others.length){
            b+='<div style="margin:8px 0 4px"><span class="ps-kv-label">참고 테이블</span></div>';
            b+='<div class="ps-tags">';
            others.forEach(function(t){
              _cxIdx++;
              if(_cxIdx===_CX_MAX+1&&_cxNeedFold)b+='</div><div class="ps-more-zone" style="display:none"><div class="ps-tags">';
              var display=t.label&&t.label!==t.name?t.label+' ('+t.name+')':t.name;
              b+='<span class="ps-chip status-candidate" title="'+esc(t.name)+'">'+esc(display)+'</span>';
            });
            b+='</div>';
          }
        }
        if(cx.rejected_tables&&cx.rejected_tables.length){
          _cxIdx+=cx.rejected_tables.length;
          if(_cxIdx>_CX_MAX&&_cxNeedFold&&!b.includes('ps-more-zone'))b+='<div class="ps-more-zone" style="display:none">';
          b+='<div style="margin:8px 0 4px"><span class="ps-kv-label">제외된 테이블</span></div>';
          b+='<div class="ps-rejected-list">'+cx.rejected_tables.map(function(t){
            var display=t.label&&t.label!==t.name?t.name+'('+t.label+')':t.name;
            return esc(display);
          }).join(', ')+'</div>';
        }
        /* 유사SQL·매뉴얼·용어는 더 보기 내부에 포함 */
        var _extraKv='';
        if(cx.biz_terms&&cx.biz_terms.length){
          _extraKv+='<div class="ps-kv"><span class="ps-kv-label">용어</span><span class="ps-kv-val"><span class="ps-tags">'+cx.biz_terms.map(function(bt){return '<span class="ps-chip">'+esc(bt)+'</span>';}).join('')+'</span></span></div>';
        }
        if(cx.use_cases&&cx.use_cases.length){
          _extraKv+='<div class="ps-kv ps-kv-block"><span class="ps-kv-label">유사SQL ('+cx.use_cases.length+'건)</span>'
            +'<ul class="ps-ref-list">'+cx.use_cases.map(function(d){return '<li>'+esc(d)+'</li>';}).join('')+'</ul></div>';
        }
        if(cx.manuals&&cx.manuals.length){
          _extraKv+='<div class="ps-kv ps-kv-block"><span class="ps-kv-label">매뉴얼 ('+cx.manuals.length+'건)</span>'
            +'<ul class="ps-ref-list">'+cx.manuals.map(function(d){return '<li>'+esc(d)+'</li>';}).join('')+'</ul></div>';
        }
        if(_cxNeedFold){
          if(b.includes('ps-more-zone'))b+='</div>';/* close .ps-more-zone */
          b+=_extraKv;
          b+='</div>';/* close .ps-more-wrap */
          b+='<button class="ps-toggle-more">더 보기 ('+_cxTotal+'개)</button>';
        }else{
          b+=_extraKv;}
        return b;
      });
    }
    /* ── 4. AI 추론 (root-level ai_decisions) ── */
    if(ps.ai_decisions){
      num++;
      var ai=ps.ai_decisions;
      var inferences=ai.inferences||[];
      /* 중복 제거: question+value 조합 기준 */
      var seen={},uniqInf=[];
      inferences.forEach(function(inf){
        var key=typeof inf==='string'?inf:((inf.question||'')+'|'+(inf.value||''));
        if(!seen[key]){seen[key]=true;uniqInf.push(inf);}
      });
      var assumptions=ai.pending_assumptions||[];
      var aiBrief=uniqInf.length?uniqInf.length+'건 추론':'';
      if(assumptions.length)aiBrief+=(aiBrief?' · ':'')+assumptions.length+'건 가정';
      h+=_psStage(num,'AI 추론',aiBrief||'추론 없음',function(){
        var b='';
        if(uniqInf.length){
          uniqInf.forEach(function(inf){
            var q=typeof inf==='string'?inf:(inf.question||'');
            var v=typeof inf==='string'?'':(inf.value||'');
            b+='<div class="ps-inference"><span class="ps-inf-icon">→</span>';
            b+='<span class="ps-inf-text">'+esc(q);
            if(v)b+=' <span class="ps-inf-val">'+esc(v)+'</span>';
            b+='</span></div>';
          });
        }
        if(assumptions.length){
          assumptions.forEach(function(a){
            var txt=typeof a==='string'?a:(a.text||JSON.stringify(a));
            b+='<div class="ps-assumption">※ '+esc(txt)+'</div>';
          });
        }
        if(ai.notice)b+='<div class="ps-notice">'+esc(ai.notice)+'</div>';
        return b;
      });
    }
    /* ── 5. 결과 ── */
    if(ps.validation&&Object.keys(ps.validation).length){
      num++;
      var vl=ps.validation;
      var vBrief=vl.row_label||vl.summary||'검증 완료';
      h+=_psStage(num,'결과',vBrief,function(){
        var b='';
        if(vl.sql){b+='<details class="ps-sql-fold"><summary class="ps-sql-summary">실행 SQL 보기</summary><pre class="ps-sql-code"><code class="language-sql">'+esc(_formatSQL(vl.sql))+'</code></pre></details>';}
        if(vl.summary)b+='<div class="ps-kv"><span class="ps-kv-label">검증</span><span class="ps-kv-val">'+esc(vl.summary)+'</span></div>';
        if(vl.viz_judgment)b+='<div class="ps-kv"><span class="ps-kv-label">시각화 판단</span><span class="ps-kv-val">'+esc(vl.viz_judgment)+'</span></div>';
        return b;
      });

    h+='</div></details>';
    slot.innerHTML=h;
    /* ★ SQL 구문 강조 */
    slot.querySelectorAll('pre code.language-sql').forEach(function(block){
      if(typeof hljs!=='undefined')hljs.highlightElement(block);
    });
    /* ★ 컨텍스트 탐색 더 보기/접기 이벤트 */
    slot.querySelectorAll('.ps-toggle-more').forEach(function(btn){
      var origText=btn.textContent;
      btn.addEventListener('click',function(){
        var wrap=btn.previousElementSibling;
        if(!wrap||!wrap.classList.contains('ps-more-wrap'))return;
        var zone=wrap.querySelector('.ps-more-zone');
        if(!zone)return;
        var visible=zone.style.display!=='none';
        zone.style.display=visible?'none':'';
        wrap.classList.toggle('collapsed',visible);
        btn.textContent=visible?origText:'접기';
      });
    });
  }
  function _psStage(num,title,brief,bodyFn){
    var body=bodyFn();
    var h='<details class="ps-stage" open>'
      +'<summary class="ps-stage-head">'
      +'<span class="ps-stage-num">'+num+'</span>'
      +'<span class="ps-stage-title">'+esc(title)+'</span>'
      +'<span class="ps-stage-brief">'+esc(brief)+'</span>'
      +'<span class="ps-stage-chev">▾</span>'
      +'</summary>';
    if(body)h+='<div class="ps-stage-body">'+body+'</div>';
    h+='</details>';
    return h;
  }
  /* ── _wrapRefBlocks: 마크다운 내 details 태그를 ref-block 스타일로 래핑 ── */
  function _wrapRefBlocks(bub){
    bub.querySelectorAll('details').forEach(function(det){
      var sum=det.querySelector('summary');
      if(!sum)return;
      var txt=sum.textContent.trim();
      if(txt.indexOf('조회 기준')>=0||txt.indexOf('조회 과정')>=0||txt.indexOf('참고')>=0){
        det.className='ref-block';
        if(!det.hasAttribute('open'))det.setAttribute('open','');
        var body=document.createElement('div');body.className='ref-body';
        while(det.lastChild&&det.lastChild!==sum&&det.lastChild!==body){body.insertBefore(det.lastChild,body.firstChild);}
        det.appendChild(body);
        sum.className='ref-header';
        sum.innerHTML='<span class="ref-tag">참고</span>'
          +'<span class="ref-title">'+esc(txt)+'</span>'
          +'<span class="ref-chevron">▾</span>';
      }
    });
  }
  function showBanner(type,text){
    hideWel();
    var el=document.createElement('div');el.className='status-banner '+type;el.textContent=text;
    chat().appendChild(el);autoScroll();
    setTimeout(function(){el.remove();},5000);
  }
  function attachCodeCopy(container){
    container.querySelectorAll('pre').forEach(function(pre){
      if(pre.closest('.code-wrap'))return;
      var w=document.createElement('div');w.className='code-wrap';
      pre.parentNode.insertBefore(w,pre);w.appendChild(pre);
      var b=document.createElement('button');b.className='content-copy';
      b.innerHTML=ICOPY+' 복사';
      b.onclick=function(){
        var code=pre.querySelector('code')?pre.querySelector('code').innerText:pre.innerText;
        navigator.clipboard.writeText(code).then(function(){
          b.innerHTML=IC+' 복사됨';setTimeout(function(){b.innerHTML=ICOPY+' 복사';},2000);
        }).catch(function(){toast('복사 실패');});
      };
      w.appendChild(b);
    });
    /* Markdown table → copy button (버튼을 table-wrap 바깥 래퍼에 배치) */
    container.querySelectorAll('table').forEach(function(tbl){
      if(tbl.closest('.table-wrap'))return;
      var outer=document.createElement('div');outer.className='table-copy-wrap';
      var w=document.createElement('div');w.className='table-wrap';
      tbl.parentNode.insertBefore(outer,tbl);
      w.appendChild(tbl);outer.appendChild(w);
      var b=document.createElement('button');b.className='content-copy';
      b.innerHTML=ICOPY+(_lsPref('pref-table-copy','tsv')==='tsv'?' TSV 복사':' CSV 복사');
      b.onclick=function(){
        var csv=_tableToCSV(tbl);
        navigator.clipboard.writeText(csv).then(function(){
          b.innerHTML=IC+' 복사됨';setTimeout(function(){b.innerHTML=ICOPY+(_lsPref('pref-table-copy','tsv')==='tsv'?' TSV 복사':' CSV 복사');},2000);
        }).catch(function(){toast('복사 실패');});
      };
      outer.appendChild(b);
    });
  }
  function _tableToCSV(tbl){
    var fmt=_lsPref('pref-table-copy','tsv');
    var sep=fmt==='tsv'?'\t':',';
    var rows=[];
    tbl.querySelectorAll('tr').forEach(function(tr){
      var cells=[];
      tr.querySelectorAll('th,td').forEach(function(c){
        var t=c.textContent.trim().replace(/"/g,'""');
        cells.push('"'+t+'"');
      });
      if(cells.length)rows.push(cells.join(sep));
    });
    return rows.join('\n');
  }
  function _renderClarificationRestored(row,msg){
    /* Find the next user message to determine which option was selected */
    var allMsgs=MS.allMessages();var selectedText=null;
    for(var i=0;i<allMsgs.length;i++){
      if(allMsgs[i].id===msg.id&&i+1<allMsgs.length&&allMsgs[i+1].role==='user'){
        selectedText=allMsgs[i+1].text;break;
      }
    }
    /* Look for option-like patterns in message: numbered lists */
    var bub=row.querySelector('.bot-bubble');if(!bub)return;
    bub.querySelectorAll('li,p').forEach(function(el){
      var t=el.textContent.trim();
      if(selectedText&&t.indexOf(selectedText)!==-1){
        el.style.background='var(--bg-accent-subtle)';el.style.borderRadius='4px';el.style.padding='2px 4px';
      }
    });
  }
  /* ── 명확화 카드 렌더 (Phase 2) ── */
  function _renderClarification(row,msg){
    var cl=msg.clarification;if(!cl||!cl.question)return;
    var card=document.createElement('div');
    card.className='clarification-card';
    card.setAttribute('role','group');
    card.setAttribute('aria-label','명확화 질문');
    var qt=cl.question_type||'single_select';
    var opts=cl.options||[];
    /* 옵션 없는 single_select → free_text 폴백 */
    if((qt==='single_select'||qt==='SINGLE_SELECT')&&!opts.length){qt='free_text';}
    var h='<h4>'+esc(cl.question)+'</h4>';
    if(qt==='single_select'||qt==='SINGLE_SELECT'){
      opts.forEach(function(o,i){
        h+='<button class="clar-option" data-idx="'+i+'">'+esc(o)+'</button>';
      });
      h+='<button class="clar-option" data-idx="-1">기타 (직접 입력)</button>';
      h+='<input class="clar-free-input" placeholder="직접 입력해주세요…" />';
      h+='<div class="clar-actions"><button class="clar-submit" disabled>제출</button></div>';
    }else if(qt==='confirm'||qt==='CONFIRM'){
      h+='<div class="clar-actions" style="justify-content:flex-start;gap:8px;margin-top:8px">';
      h+='<button class="clar-submit" data-val="예" style="background:var(--bg-accent)">예</button>';
      h+='<button class="clar-submit" data-val="아니오" style="background:var(--bg3);color:var(--txt);border:1px solid var(--border)">아니오</button>';
      h+='</div>';
    }else{
      /* free_text */
      h+='<input class="clar-free-input visible" placeholder="답변을 입력해주세요…" />';
      h+='<div class="clar-actions"><button class="clar-submit" disabled>제출</button></div>';
    }
    card.innerHTML=h;
    /* DOM 삽입: bot-bubble 숨기고 그 자리에 카드 배치 */
    var content=row.querySelector('.msg-content');
    var bub=row.querySelector('.bot-bubble');
    if(bub){bub.style.display='none';}
    if(bub&&bub.nextSibling){content.insertBefore(card,bub.nextSibling);}
    else if(content){content.appendChild(card);}
    /* ── 이벤트 바인딩 ── */
    var selected=null,customText='';
    var submitBtn=card.querySelector('.clar-submit');
    var freeInput=card.querySelector('.clar-free-input');
    if(qt==='single_select'||qt==='SINGLE_SELECT'){
      card.querySelectorAll('.clar-option').forEach(function(btn){
        btn.addEventListener('click',function(){
          card.querySelectorAll('.clar-option').forEach(function(b){b.classList.remove('selected');});
          btn.classList.add('selected');
          var idx=parseInt(btn.dataset.idx);
          if(idx===-1){
            selected=null;
            if(freeInput){freeInput.classList.add('visible');freeInput.focus();}
          }else{
            selected=opts[idx]||null;
            if(freeInput){freeInput.classList.remove('visible');freeInput.value='';customText='';}
          }
          if(submitBtn)submitBtn.disabled=(!selected&&!customText);
        });
      });
      if(freeInput){
        freeInput.addEventListener('input',function(){
          customText=freeInput.value.trim();
          if(submitBtn)submitBtn.disabled=(!selected&&!customText);
        });
        freeInput.addEventListener('keydown',function(e){
          if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();if(submitBtn&&!submitBtn.disabled)submitBtn.click();}
        });
      }
      if(submitBtn){
        submitBtn.addEventListener('click',function(){
          var answer=selected||customText;
          if(!answer)return;
          _submitClarification(card,answer,msg);
        });
      }
    }else if(qt==='confirm'||qt==='CONFIRM'){
      card.querySelectorAll('.clar-submit').forEach(function(btn){
        var _clicked=false;
        btn.addEventListener('click',function(){
          if(_clicked)return;_clicked=true;
          _submitClarification(card,btn.dataset.val,msg);
        });
      });
    }else{
      /* free_text */
      if(freeInput){
        freeInput.addEventListener('input',function(){
          customText=freeInput.value.trim();
          if(submitBtn)submitBtn.disabled=!customText;
        });
        freeInput.addEventListener('keydown',function(e){
          if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();if(submitBtn&&!submitBtn.disabled)submitBtn.click();}
        });
      }
      if(submitBtn){
        submitBtn.addEventListener('click',function(){
          if(!customText)return;
          _submitClarification(card,customText,msg);
        });
      }
    }
    autoScroll();
  }
  function _submitClarification(card,answer,msg){
    card.setAttribute('data-submitting','1');
    /* 입력창 상태 원복 — placeholder만 되돌리고, 사용자가 입력 중인 텍스트는 보존 */
    IC2.setClarification(false);
    /* 사용자 메시지 렌더 + 전송 */
    resetAutoScroll();
    RD.render(MS.create('user',answer));
    SB.saveCurrentMessage('user',answer);
    if(!CN.send(answer)){RD.showBanner('error','서버에 연결되어 있지 않습니다.');return;}
    ED.resetCancel();IC2.setBusy(true);ED.startBusyTimer();
  }
  /* ── Trace 다운로드 ── */
  function _onTraceDownload(msg,btn){
    var files=msg.traceFiles||[];
    if(!files.length)return;
    if(files.length===1){
      window.open('/api/traces/'+encodeURIComponent(files[0].filename));
      return;
    }
    _showTraceDropdown(btn,files);
  }
  function _showTraceDropdown(anchor,files){
    var old=document.querySelector('.trace-dropdown');
    if(old){old.remove();return;}
    var dd=document.createElement('div');dd.className='trace-dropdown';
    files.forEach(function(f){
      var item=document.createElement('a');item.className='trace-item';
      item.href='/api/traces/'+encodeURIComponent(f.filename);
      item.target='_blank';item.textContent=f.name;
      dd.appendChild(item);
    });
    anchor.style.position='relative';
    anchor.appendChild(dd);
    function cleanup(){
      if(dd.parentNode)dd.remove();
      document.removeEventListener('click',onClickOutside);
      document.removeEventListener('keydown',onEsc);
    }
    function onClickOutside(e){if(!dd.contains(e.target)&&e.target!==anchor)cleanup();}
    function onEsc(e){if(e.key==='Escape')cleanup();}
    setTimeout(function(){
      document.addEventListener('click',onClickOutside);
      document.addEventListener('keydown',onEsc);
    },0);
  }
  return{ensureDOM:ensureDOM,render:render,showBanner:showBanner,hideWel:hideWel,showWel:showWel,clearChat:clearChat,_updateLikeButtons:_updateLikeButtons,_renderClarification:_renderClarification};
})();

/* ═══════════════════════════════════════
   4. SE — Stream Engine
   ═══════════════════════════════════════ */
var SE=(function(){
  var _a=new Map();
  function streamText(id,full,opts){
    opts=opts||{};cancel(id);
    var st={cancelled:false};_a.set(id,st);
    var cs=opts.chunkSize||3,iv=opts.interval||20;
    return new Promise(function(res){
      var p=0,msg=MS.get(id);
      if(!msg){res();return;}
      msg.text='';msg.status='streaming';
      (function tick(){
        if(st.cancelled||p>=full.length){
          msg.text=st.cancelled?msg.text:full;msg.status='done';
          RD.render(msg);_a.delete(id);res();return;
        }
        p+=cs;msg.text=full.slice(0,p);RD.render(msg);setTimeout(tick,iv);
      })();
    });
  }
  function appendChunk(id,ch){var m=MS.get(id);if(!m)return;m.text+=ch;m.status='streaming';RD.render(m);}
  function finalize(id){var m=MS.get(id);if(!m)return;m.status='done';m.showThinking=false;RD.render(m);}
  function cancel(id){var s=_a.get(id);if(s)s.cancelled=true;}
  function cancelAll(){_a.forEach(function(s){s.cancelled=true;});}
  return{streamText:streamText,appendChunk:appendChunk,finalize:finalize,cancel:cancel,cancelAll:cancelAll};
})();

/* ═══════════════════════════════════════
   5. ED — Event Dispatcher
   ═══════════════════════════════════════ */
var ED=(function(){
  var _cur=null,_last=null,_bt=null,_cancelled=false;
  function _cbt(){if(_bt){clearTimeout(_bt);_bt=null;}}
  function _sbt(){_cbt();_bt=setTimeout(function(){if(!_cur)return;RD.showBanner('error','서버 응답이 지연되고 있습니다.');_ffc();IC2.setBusy(false);},30000);}
  function _ffc(){
    if(!_cur)return;
    var p=MS.get(_cur);
    if(p){SE.cancel(_cur);p.status='done';p.showThinking=false;
      if(p.progress.length){p.progress.forEach(function(s){s.status='done';});
        p.progressCollapsed=true;p.progressElapsed=p.progressStartTime?(Date.now()-p.progressStartTime)/1000:null;}
      RD.render(p);
    }_cur=null;
  }
  function handle(data){
    _cbt();
    /* cancel 후 도착한 파이프라인 응답은 무시 — 최종 메시지에서 플래그 해제 */
    if(_cancelled){if((data.type==='stream'&&data.action==='end')||data.type==='response'){_cancelled=false;}return;}
    switch(data.type){
      case 'response':return handleLegacy(data);
      case 'stream':return handleStream(data);
      case 'llm_delta':return handleLlmDelta(data);
      case 'progress':return handleProgress(data);
      case 'viz':return handleViz(data);
      case 'result_data':return handleResultData(data);
      case 'download_ready':return handleDownloadReady(data);
      case 'status':return RD.showBanner('status',data.message||'');
      case 'error':return handleError(data);
      default:if(data.message)return handleLegacy(data);
    }
  }
  /* llm_delta: analyzer/SVG 토큰 스트리밍 — rAF 배치 렌더링.
     part_type='analysis' 은 메시지 본문에 누적, part_type='svg' 는 무시(완성본만 수신). */
  var _llmBuf={text:'',pending:false,part:''};
  function _llmFlush(){
    _llmBuf.pending=false;
    if(!_cur)return;
    var m=MS.get(_cur);if(!m)return;
    if(m.showThinking){
      m.showThinking=false;
      if(m.progress.length){m.progress.forEach(function(s){s.status='done';});m.progressCollapsed=true;}
    }
    m.text=_llmBuf.text;m.status='streaming';RD.render(m);
  }
  function _llmScheduleFlush(){
    if(_llmBuf.pending)return;
    _llmBuf.pending=true;
    if(window.requestAnimationFrame)requestAnimationFrame(_llmFlush);
    else setTimeout(_llmFlush,16);
  }
  function handleLlmDelta(data){
    var part=data.part_type||'';
    /* SVG 스트리밍은 최종 svg 이벤트(viz)로 렌더링. 중간 토큰은 무시. */
    if(part==='svg')return;
    /* progress/stream.start 이전에 llm_delta 가 먼저 올 수 있으므로 메시지 자동 생성. */
    if(!_cur){
      var msg=MS.create('assistant','',{status:'streaming',showThinking:true,thinkingLabel:'답변 작성 중'});
      msg.progressStartTime=Date.now();_cur=msg.id;
      RD.ensureDOM(msg);RD.render(msg);IC2.setBusy(true);
    }
    if(data.event==='start'){_llmBuf.text='';_llmBuf.part=part;return;}
    if(data.event==='reset'){_llmBuf.text='';_llmScheduleFlush();return;}
    if(data.event==='delta'){_llmBuf.text+=(data.text||'');_llmScheduleFlush();return;}
    if(data.event==='end'){
      /* 최종 본문은 stream.end 에서 수신된 서버 합성본이 덮어씀. 여기선 플러시만. */
      _llmScheduleFlush();
    }
  }
  async function handleLegacy(data){
    _ffc();
    var msg=MS.create('assistant','',{status:'streaming',showThinking:true,thinkingLabel:'데이터 분석 중'});
    msg.progressStartTime=Date.now();_cur=msg.id;
    RD.ensureDOM(msg);RD.render(msg);IC2.setBusy(true);
    var steps=[{label:'🔍 데이터 조회 중…',delay:500,phase:'interpret',phaseLabel:'사용자의 질의를 분석하는 중'},{label:'🧠 분석 중…',delay:600,phase:'reason',phaseLabel:'데이터를 탐색하고 SQL을 생성하는 중'},{label:'📊 결과 정리 중…',delay:500,phase:'present',phaseLabel:'결과를 정리하는 중'}];
    for(var i=0;i<steps.length;i++){
      await sleep(steps[i].delay);if(_cur!==msg.id)return;
      var last=msg.progress[msg.progress.length-1];
      if(last&&last.status==='active')last.status='done';
      msg.progress.push({label:steps[i].label,status:'active',phase:steps[i].phase,phaseLabel:steps[i].phaseLabel});RD.render(msg);
    }
    await sleep(250);if(_cur!==msg.id)return;
    msg.progress.forEach(function(s){s.status='done';});msg.showThinking=false;RD.render(msg);
    await SE.streamText(msg.id,data.message||'');
    if(_cur!==msg.id)return;
    msg.progressElapsed=(Date.now()-msg.progressStartTime)/1000;msg.progressCollapsed=true;RD.render(msg);
    if(data.visualization){var nv=VIZ.normalize(data.visualization);if(nv){MS.update(msg.id,{visualization:nv});RD.render(msg);}}
    if(data.insight){msg.insight=data.insight;RD.render(msg);}
    /* ── Capture message_uuid from legacy response ── */
    msg.hasMetadata=!!(data.insight||data.result_data||data.has_result_data||msg.resultData||data.process_summary||(data.trace_files&&data.trace_files.length));
    if(data.message_uuid){MS.update(msg.id,{turnId:data.message_uuid});}
    if(data.user_message_uuid){
      var allMsgs=MS.allMessages();
      for(var ui=allMsgs.length-1;ui>=0;ui--){
        if(allMsgs[ui].role==='user'){MS.update(allMsgs[ui].id,{turnId:data.user_message_uuid});break;}
      }
    }
    SB.saveCurrentMessage('assistant',data.message||'');
    /* 파이프라인 완료 후 title 동기화 (upsert_session_index 이후 시점) */
    var _allMsgs=MS.allMessages();for(var ti=_allMsgs.length-1;ti>=0;ti--){if(_allMsgs[ti].role==='user'){SB.updateTitle(_allMsgs[ti].text);break;}}
    _last=_cur;_cur=null;_cbt();IC2.setBusy(false);
  }
  function handleStream(data){
    if(data.action==='start'){
      /* 이미 progress로 생성된 메시지가 있으면 재사용 */
      if(_cur){
        var existing=MS.get(_cur);
        if(existing){existing.thinkingLabel=data.label||'답변 작성 중';RD.render(existing);}
      }else{
        var msg=MS.create('assistant','',{status:'streaming',showThinking:true,thinkingLabel:data.label||'답변 작성 중'});
        msg.progressStartTime=Date.now();_cur=msg.id;RD.ensureDOM(msg);RD.render(msg);IC2.setBusy(true);
      }
      return;
    }
    if(data.action==='chunk'&&_cur){
      var m=MS.get(_cur);
      if(m&&m.showThinking){
        m.showThinking=false;
        /* progress가 없으면 완료 표시 추가 */
        if(m.progress.length){m.progress.forEach(function(s){s.status='done';});m.progressCollapsed=true;}
        RD.render(m);
      }
      SE.appendChunk(_cur,data.text||'');return;
    }
    if(data.action==='end'&&_cur){
      var m2=MS.get(_cur);
      if(m2){
        /* ── 명확화 분기 ── */
        if(data.status==='awaiting_clarification'&&data.clarification_request){
          m2.turnType='clarification';
          m2.clarification=data.clarification_request;
          SE.finalize(_cur);
          if(m2.progress.length){m2.progressElapsed=(Date.now()-(m2.progressStartTime||Date.now()))/1000;m2.progressCollapsed=true;}
          RD.render(m2);
          RD._renderClarification(
            document.querySelector('[data-id="'+m2.id+'"]'),m2
          );
          if(data.message_uuid){MS.update(m2.id,{turnId:data.message_uuid});}
          if(data.user_message_uuid){
            var _aMsgs=MS.allMessages();
            for(var _ui=_aMsgs.length-1;_ui>=0;_ui--){
              if(_aMsgs[_ui].role==='user'){MS.update(_aMsgs[_ui].id,{turnId:data.user_message_uuid});break;}
            }
          }
          SB.saveCurrentMessage('assistant',m2.text);
          IC2.setClarification(true);
          _last=_cur;_cur=null;_cbt();IC2.setBusy(false);
          return;
        }
        /* ── 기존 정상/취소/실패 end 처리 ── */
        /* ── Capture all stream.end data before finalize to minimize re-renders ── */
        if(data.insight){m2.insight=data.insight;}
        if(data.result_data){m2.resultData=data.result_data;}
        if(data.process_summary){m2.processSummary=data.process_summary;}
        if(data.trace_files&&data.trace_files.length){m2.traceFiles=data.trace_files;}
        /* 실패/취소 상태를 finalize 전에 메시지에 반영 — SE.finalize가 status를 'done'으로 덮기 때문 */
        if(data.status==='failure'||data.status==='error'){m2.turnType='error';}
        SE.finalize(_cur);
        if(m2.turnType==='error'){m2.status='failure';}
        if(m2.progress.length){m2.progressElapsed=(Date.now()-(m2.progressStartTime||Date.now()))/1000;m2.progressCollapsed=true;}
        /* hasMetadata 판정: insight·result_data·process_summary·trace_files 중 하나라도 있으면 */
        m2.hasMetadata=!!(data.insight||data.has_result_data||m2.resultData||data.process_summary||(data.trace_files&&data.trace_files.length));
        RD.render(m2);
        /* ── Capture message_uuid from stream.end ── */
        if(data.message_uuid){MS.update(m2.id,{turnId:data.message_uuid});}
        if(data.user_message_uuid){
          /* Find and update the last user message */
          var allMsgs=MS.allMessages();
          for(var ui=allMsgs.length-1;ui>=0;ui--){
            if(allMsgs[ui].role==='user'){MS.update(allMsgs[ui].id,{turnId:data.user_message_uuid});break;}
          }
        }
        SB.saveCurrentMessage('assistant',m2.text);
        /* 파이프라인 완료 후 title 동기화 (upsert_session_index 이후 시점) */
        var _allMsgs=MS.allMessages();for(var ti=_allMsgs.length-1;ti>=0;ti--){if(_allMsgs[ti].role==='user'){SB.updateTitle(_allMsgs[ti].text);break;}}
      }
      _last=_cur;_cur=null;_cbt();IC2.setBusy(false);
    }
  }
  function handleProgress(data){
    /* progress가 stream:start보다 먼저 오면 메시지를 자동 생성 */
    if(!_cur){
      var msg=MS.create('assistant','',{status:'streaming',showThinking:true,thinkingLabel:data.thinkingLabel||'처리 중…'});
      msg.progressStartTime=Date.now();_cur=msg.id;
      RD.ensureDOM(msg);RD.render(msg);IC2.setBusy(true);
    }
    var msg=MS.get(_cur);if(!msg)return;
    if(data.action==='add'){
      var last=msg.progress[msg.progress.length-1];if(last&&last.status==='active')last.status='done';
      msg.progress.push({label:data.label,status:'active',phase:data.phase||'',phaseLabel:data.phaseLabel||''});
    }
    else if(data.action==='done'){var l=msg.progress[msg.progress.length-1];if(l)l.status='done';}
    else if(data.action==='set'){msg.progress=(data.steps||[]).map(function(s){return{label:s.label,status:s.status||'active',phase:s.phase||'',phaseLabel:s.phaseLabel||''};});}
    if(data.thinkingLabel!==undefined){msg.thinkingLabel=data.thinkingLabel;msg.showThinking=true;}
    RD.render(msg);
  }
  function handleViz(data){
    /* 백엔드는 파이프라인 완료 시점에 1회만 완전한 viz 이벤트를 전송한다
       (src/main.py L469-479, has_visualization=true일 때만). 따라서 prev 병합은
       레거시/동일 메시지 재발행 방어용이며, 정상 경로에서는 data만으로도 충분. */
    var id=data.messageId||_cur;if(!id)return;
    var msg=MS.get(id);if(!msg)return;
    var prev=msg.visualization||{};
    var merged={
      svg_code:data.svg_code||data.code||prev.content||'',
      title:data.title||prev.title||'',
      chart_type:data.chart_type||prev.chart_type||''
    };
    var nv=VIZ.normalize(merged);
    if(nv){MS.update(id,{visualization:nv});RD.render(msg);}
  }
  /* ── handleResultData: stream.start 직후 도착하는 result_data 즉시 렌더링 ── */
  function handleResultData(data){
    var id=_cur;if(!id)return;
    var msg=MS.get(id);if(!msg)return;
    msg.resultData=data.data;
    RD.render(msg);
  }
  function handleError(data){
    RD.showBanner('error',data.message||'오류가 발생했습니다.');
    _ffc();_cbt();IC2.setBusy(false);
  }
  function handleDownloadReady(data){
    var id=_cur||_last;
    if(!id)return;
    var msg=MS.get(id);
    if(!msg)return;
    msg.downloadReady={session_id:data.session_id,row_count:data.row_count||0,formats:data.formats||['csv']};
  }
  function getCurrentId(){return _cur;}
  function startBusyTimer(){_sbt();}
  function forceFinish(){_ffc();_cbt();_cancelled=true;}
  function resetCancel(){_cancelled=false;}
  return{handle:handle,getCurrentId:getCurrentId,startBusyTimer:startBusyTimer,forceFinish:forceFinish,resetCancel:resetCancel};
})();

/* ═══════════════════════════════════════
   7. CN — WebSocket Connection
   ═══════════════════════════════════════ */
var CN=(function(){
  var sid='session-'+Date.now(),ws=null,att=0,_offline=false,_intentionalClose=false;
  function url(){return(location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws/'+sid;}
  function connect(){
    setStatus('connecting');
    ws=new WebSocket(url());
    ws.onopen=function(){att=0;setStatus('connected');_setOffline(false);};
    ws.onmessage=function(e){try{ED.handle(JSON.parse(e.data));}catch(err){console.error(err);}};
    ws.onclose=function(){if(_intentionalClose){_intentionalClose=false;return;}setStatus('disconnected');_setOffline(true);ED.forceFinish();IC2.setBusy(false);if(att<5){setTimeout(connect,1000*Math.pow(2,att));att++;}else{RD.showBanner('error','서버 연결이 끊어졌습니다. 페이지를 새로고침해 주세요.');}};
    ws.onerror=function(err){console.error('[WS]',err);};
  }
  function _streamPref(){try{return(localStorage.getItem('pref-streaming')||'on')==='on';}catch(e){return true;}}
  function send(t,opts){
    if(ws&&ws.readyState===1){
      var payload={text:t,streaming:_streamPref()};
      if(opts)Object.assign(payload,opts);
      ws.send(JSON.stringify(payload));
      return true;
    }
    return false;
  }
  function reconnect(){_intentionalClose=true;if(ws)ws.close();sid='session-'+Date.now();att=0;connect();}
  function reconnectWith(sessionId){_intentionalClose=true;if(ws)ws.close();sid=sessionId;att=0;connect();}
  function getSid(){return sid;}
  function setStatus(s){
    var d=document.getElementById('statusDot'),l=document.getElementById('statusLabel');
    d.className='status-dot';
    if(s==='connected'){d.classList.add('connected');l.textContent='연결됨';}
    else if(s==='connecting'){d.classList.add('connecting');l.textContent='연결 중…';}
    else{l.textContent='연결 끊김';}
  }
  function _setOffline(v){
    _offline=v;
    var banner=document.getElementById('offlineBanner');
    if(banner){v?banner.classList.add('visible'):banner.classList.remove('visible');}
  }
  function isOffline(){return _offline;}
  return{connect:connect,send:send,reconnect:reconnect,reconnectWith:reconnectWith,getSid:getSid,isOffline:isOffline};
})();

/* ═══════════════════════════════════════
   8. CM — Command Manager (/ 자동완성)
   ═══════════════════════════════════════ */
var CM=(function(){
  var CMDS=[
    {name:'/new',desc:'새 대화 — 새로운 대화를 시작합니다',icon:'+'}
  ];
  var _popup=null,_idx=0,_flt=[],_composing=false;
  function inp(){return document.getElementById('messageInput');}
  function wrap(){return document.getElementById('inputWrapper');}
  function init(){
    inp().addEventListener('input',_onInput);
    inp().addEventListener('keydown',_onKey);
    inp().addEventListener('compositionstart',function(){_composing=true;});
    inp().addEventListener('compositionend',function(){_composing=false;});
    document.addEventListener('click',function(e){if(_popup&&!wrap().contains(e.target))_hide();});
  }
  function _onInput(){
    var v=inp().value;
    if(!v.startsWith('/')||v.includes(' ')){_hide();return;}
    var q=v.toLowerCase();
    _flt=CMDS.filter(function(c){return c.name.startsWith(q);});
    if(v==='/'){_flt=CMDS.slice();}
    if(_flt.length===0){_hide();return;}
    _idx=0;_show();
  }
  function _onKey(e){
    if(_composing)return;
    if(!_popup){
      if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();App.sendMessage();}
      return;
    }
    if(e.key==='Tab'){e.preventDefault();_select();return;}
    if(e.key==='Enter'){e.preventDefault();_select();App.sendMessage();return;}
    if(e.key==='ArrowDown'){e.preventDefault();_idx=(_idx+1)%_flt.length;_renderItems();return;}
    if(e.key==='ArrowUp'){e.preventDefault();_idx=(_idx-1+_flt.length)%_flt.length;_renderItems();return;}
    if(e.key==='Escape'){_hide();}
  }
  function _select(){var cmd=_flt[_idx];if(!cmd)return;inp().value=cmd.name;_hide();inp().focus();}
  function _show(){if(!_popup){_popup=document.createElement('div');_popup.className='cmd-popup';wrap().appendChild(_popup);}_renderItems();}
  function _renderItems(){
    if(!_popup)return;
    _popup.innerHTML=_flt.map(function(c,i){
      return '<div class="cmd-item'+(i===_idx?' active':'')+'" data-idx="'+i+'"><div class="cmd-item-icon">'+c.icon+'</div><div class="cmd-item-text"><div class="cmd-item-name">'+esc(c.name)+'</div><div class="cmd-item-desc">'+esc(c.desc)+'</div></div><span class="cmd-item-key">Tab</span></div>';
    }).join('');
    _popup.querySelectorAll('.cmd-item').forEach(function(el){
      el.addEventListener('mouseenter',function(){_idx=parseInt(el.dataset.idx);_renderItems();});
      el.addEventListener('click',function(){_idx=parseInt(el.dataset.idx);_select();});
    });
  }
  function _hide(){if(_popup){_popup.remove();_popup=null;}}
  function tryExec(text){
    var cmd=text.trim().toLowerCase();
    if(cmd==='/new'){SB.onNewChat();return true;}
    return false;
  }
  return{init:init,tryExec:tryExec};
})();

/* ═══════════════════════════════════════
   9. SB — Sidebar Manager
   ═══════════════════════════════════════ */
var SB=(function(){
  var K='dc-sessions',_sessions=[],_active=null,_total=0,_offset=0,_loading=false,_searchQuery='';
  async function init(){
    _showSkeleton();
    try{
      var resp=await API.getSessions('anonymous',20,0);
      _sessions=resp.sessions.map(function(s){
        return{id:s.session_id,title:s.title||'새 대화',msgs:[],ts:new Date(s.last_active).getTime()};
      });
      _total=resp.total_count||_sessions.length;
      _offset=_sessions.length;
      _sessions.sort(function(a,b){return b.ts-a.ts;});
      /* Cache in localStorage for offline fallback */
      try{localStorage.setItem(K,JSON.stringify(_sessions.slice(0,20)));}catch(e){}
    }catch(e){
      /* Fallback: localStorage cache (offline) */
      try{_sessions=JSON.parse(localStorage.getItem(K)||'[]');}catch(x){_sessions=[];}
      _total=_sessions.length;_offset=_sessions.length;
    }
    renderList();
    /* Bind search input */
    var searchEl=document.getElementById('sbSearch');
    if(searchEl){searchEl.addEventListener('input',function(){_searchQuery=searchEl.value.trim().toLowerCase();renderList();});}
  }
  function _showSkeleton(){
    var el=document.getElementById('chatList');
    el.innerHTML=[1,2,3,4].map(function(){
      return '<div class="chat-item skeleton"><div class="skeleton-bar" style="width:'+Math.floor(50+Math.random()*40)+'%"></div></div>';
    }).join('');
  }
  function newSession(){
    var id=CN.getSid();
    var s={id:id,title:'새 대화',msgs:[],ts:Date.now()};
    _sessions.unshift(s);_active=s.id;_save();renderList();return s;
  }
  function ensureSession(){if(!_active)newSession();}
  function updateTitle(text){
    if(!_active)return;
    var s=_find(_active);
    if(s&&s.title==='새 대화'&&text){
      s.title=text.slice(0,30)+(text.length>30?'…':'');_save();renderList();
      /* Fire-and-forget: sync title to server */
      API.updateTitle(s.id,s.title).catch(function(){});
    }
  }
  function saveCurrentMessage(role,text){
    if(!_active)return;var s=_find(_active);
    if(s){s.msgs.push({role:role,text:text.length>200?text.slice(0,200)+'…':text,time:Date.now()});_save();}
  }
  var _pollTimer=null;
  function _stopPoll(){if(_pollTimer){clearInterval(_pollTimer);_pollTimer=null;}}
  async function loadSession(id){
    var s=_find(id);if(!s)return;
    _active=s.id;renderList();
    _stopPoll();
    ED.forceFinish();
    SE.cancelAll();MS.clear();
    RD.clearChat();RD.hideWel();
    IC2.setBusy(false);IC2.setClarification(false);
    try{
      var resp=await API.getSession(id);
      if(!resp.messages||!resp.messages.length){RD.showWel();CN.reconnectWith(id);return;}
      /* Validate and enrich turns (detect gaps) */
      var enriched=_validateTurns(resp.messages);
      enriched.forEach(function(t){
        var msg=MS.create(t.role,t.content,{
          turnId:t.message_uuid||null,
          turnType:t.message_type||t.turnType||null,
          status:t.status||'done',
          isLiked:t.is_liked!==undefined?t.is_liked:null,
          isDownloaded:t.is_downloaded||false,
          hasMetadata:t.has_metadata||false,
          createdAt:t.created_at||null,
          restored:true,
          traceFiles:t.trace_files||[],
          processSummary:t.process_summary||null,
          resultData:t.result_data_meta||null,
          visualization:VIZ.normalize(t.visualization),
          clarification:t.clarification||null
        });
        RD.render(msg);
      });
      /* 마지막 user 턴에 대한 응답이 아직 없으면 — 서버에 실제로 파이프라인이
         실행 중인지 확인. 실행 중이면 폴링, 아니면 (크래시로 버려진 턴) gap 표시.
         일시적 네트워크 오류 대비 1회 재시도. */
      if(enriched._pendingResponse){
        var act=null;
        for(var _i=0;_i<2;_i++){
          try{act=await API.getSessionActive(id);break;}
          catch(e){if(_i===1)act=null;else await new Promise(function(r){setTimeout(r,500);});}
        }
        if(act&&act.active){
          _startPendingPoll(id);
        }else{
          var gapMsg=MS.create('system','응답이 기록되지 않았습니다.',{turnType:'gap',status:'done'});
          RD.render(gapMsg);
        }
      }
    }catch(e){
      if(e&&e.status===404){
        _sessions=_sessions.filter(function(x){return x.id!==id;});
        _active=null;_save();renderList();
        toast('대화를 찾을 수 없습니다');return;
      }
      /* Fallback to local msgs */
      if(s.msgs&&s.msgs.length){
        s.msgs.forEach(function(m){RD.render(MS.create(m.role,m.text));});
      }else{
        RD.showBanner('error','이전 대화를 불러올 수 없습니다.');
      }
    }
    CN.reconnectWith(id);
  }
  function _startPendingPoll(sessionId){
    /* 대기 중 메시지 표시 */
    var waitMsg=MS.create('assistant','',{status:'streaming',showThinking:true,thinkingLabel:'서버에서 처리 중…'});
    RD.ensureDOM(waitMsg);RD.render(waitMsg);IC2.setBusy(true);
    var attempts=0,maxAttempts=60; /* 최대 2분 (2초 간격) */
    _pollTimer=setInterval(async function(){
      attempts++;
      if(_active!==sessionId||attempts>maxAttempts){_stopPoll();IC2.setBusy(false);
        if(attempts>maxAttempts){MS.update(waitMsg.id,{status:'done',text:'응답 대기 시간이 초과되었습니다. 다시 시도해 주세요.',showThinking:false});waitMsg.turnType='error';RD.render(waitMsg);}
        return;
      }
      try{
        var resp=await API.getSession(sessionId);
        if(!resp.messages)return;
        /* 마지막 턴이 assistant인지 확인 */
        var last=resp.messages[resp.messages.length-1];
        if(last&&last.role==='assistant'){
          _stopPoll();
          /* 대기 메시지 제거하고 실제 응답 렌더링 */
          MS.remove(waitMsg.id);
          var row=document.querySelector('[data-id="'+waitMsg.id+'"]');if(row)row.remove();
          var msg=MS.create('assistant',last.content,{
            turnId:last.message_uuid||null,turnType:last.message_type||null,
            status:'done',isLiked:last.is_liked!==undefined?last.is_liked:null,
            isDownloaded:last.is_downloaded||false,hasMetadata:last.has_metadata||false,
            createdAt:last.created_at||null,restored:true,
            traceFiles:last.trace_files||[],
            processSummary:last.process_summary||null,
            resultData:last.result_data_meta||null
          });
          RD.render(msg);IC2.setBusy(false);
        }
      }catch(e){/* 네트워크 오류 — 다음 폴링에서 재시도 */}
    },2000);
  }
  function _validateTurns(turns){
    var enriched=[];
    for(var i=0;i<turns.length;i++){
      enriched.push(turns[i]);
      if(turns[i].role==='user'){
        var next=turns[i+1];
        if(!next||next.role!=='assistant'){
          var isLast=(i===turns.length-1);
          if(isLast){
            /* 마지막 user 턴 — 파이프라인이 아직 실행 중일 수 있음. gap 대신 pending 표시 */
            enriched._pendingResponse=true;
          }else{
            enriched.push({role:'system',content:'응답이 기록되지 않았습니다.',turnType:'gap'});
          }
        }
      }
    }
    return enriched;
  }
  function deleteSession(id){

      okText:'삭제',danger:true,

  function _executeDelete(id,session){

    _sessions=_sessions.filter(function(x){return x.id!==id;});
    if(_active===id){_active=null;ED.forceFinish();SE.cancelAll();MS.clear();RD.clearChat();IC2.setBusy(false);}

    /* Show undo toast */
    _showUndoToast('대화가 삭제되었습니다.',function onUndo(){
      /* Restore locally */
      if(session)_sessions.unshift(session);
      _save();renderList();
      /* Unarchive on server */
      API.unarchiveSession(id).catch(function(){});
    },function onCommit(){
      /* Delete on server (fire-and-forget) */
      API.deleteSession(id).catch(function(){
        /* Rollback on server failure */
        if(session)_sessions.unshift(session);
        _save();renderList();
        toast('대화를 삭제할 수 없습니다.');
      });
    });

  function _showUndoToast(message,onUndo,onCommit){

    t.classList.add('show');

      committed=true;t.classList.remove('show');

  async function loadMore(){
    if(_loading||_offset>=_total)return;
    _loading=true;
    try{
      var resp=await API.getSessions('anonymous',20,_offset);
      var more=resp.sessions.map(function(s){
        return{id:s.session_id,title:s.title||'새 대화',msgs:[],ts:new Date(s.last_active).getTime()};
      });
      _sessions=_sessions.concat(more);
      _total=resp.total_count||_sessions.length;
      _offset=_sessions.length;

  function renderList(){
    var el=document.getElementById('chatList');
    var filtered=_sessions;
    if(_searchQuery){
      filtered=_sessions.filter(function(s){return s.title.toLowerCase().indexOf(_searchQuery)!==-1;});

        _searchQuery?'검색 결과가 없습니다':'아직 대화가 없습니다. 새 대화를 시작해보세요!'
      )+'</div>';
      return;
    }
    /* ── Date grouping ── */
    var now=new Date(),today=_startOfDay(now),yesterday=new Date(today.getTime()-86400000);
    var weekStart=new Date(today.getTime()-(now.getDay()||7)*86400000);
    var groups=[],currentGroup=null;
    filtered.forEach(function(s){
      var d=new Date(s.ts);var label;
      if(d>=today)label='오늘';
      else if(d>=yesterday)label='어제';
      else if(d>=weekStart)label='이번 주';
      else label='이전';
      if(currentGroup&&currentGroup.label===label){currentGroup.items.push(s);}
      else{currentGroup={label:label,items:[s]};groups.push(currentGroup);}
    });
    var h='';
    groups.forEach(function(g){
      h+='<div class="sb-date-group">'+esc(g.label)+'</div>';
      g.items.forEach(function(s){
        h+='<div class="chat-item'+(s.id===_active?' active':'')+'" data-id="'+s.id+'" tabindex="0" role="button">'
          +'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>'
          +'<span class="chat-item-title" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" data-tip="'+esc(s.title)+'">'+esc(s.title)+'</span>'
          +'<button class="chat-item-more" data-more="'+s.id+'" title="더보기">'
          +'<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>'
          +'</button>'
          +'<div class="chat-item-menu" data-menu="'+s.id+'">'
          +'<button class="chat-item-menu-item" data-action="rename" data-sid="'+s.id+'"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>이름 바꾸기</button>'
          +'<button class="chat-item-menu-item danger" data-action="delete" data-sid="'+s.id+'"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6M9 6V4h6v2"/></svg>삭제</button>'
          +'</div>'
          +'</div>';
      });
    });
    /* ── Load more button ── */
    if(_offset<_total&&!_searchQuery){
      h+='<button class="sb-load-more" id="sbLoadMore">더 보기 ('+(_total-_offset)+'개)</button>';
    }
    el.innerHTML=h;
    /* ── Event bindings ── */
    function _closeAllMenus(){el.querySelectorAll('.chat-item-menu.open').forEach(function(m){m.classList.remove('open');});}
    el.querySelectorAll('.chat-item').forEach(function(b){
      b.addEventListener('click',function(e){
        if(e.target.closest('.chat-item-more')||e.target.closest('.chat-item-menu'))return;
        _closeAllMenus();
        loadSession(b.dataset.id);
      });
    });
    /* ── ··· More button → toggle menu (position:fixed) ── */
    el.querySelectorAll('.chat-item-more').forEach(function(btn){
      btn.addEventListener('click',function(e){
        e.stopPropagation();
        var menu=btn.parentElement.querySelector('.chat-item-menu');
        var isOpen=menu.classList.contains('open');
        _closeAllMenus();
        if(!isOpen){
          var rect=btn.getBoundingClientRect();
          menu.style.top=rect.bottom+2+'px';
          menu.style.left=Math.max(4,rect.right-120)+'px';
          menu.classList.add('open');
        }
      });
    });
    /* ── Menu actions ── */
    el.querySelectorAll('.chat-item-menu-item').forEach(function(mi){
      mi.addEventListener('click',function(e){
        e.stopPropagation();
        var action=mi.dataset.action,sid=mi.dataset.sid;
        _closeAllMenus();
        if(action==='delete'){deleteSession(sid);}
        if(action==='rename'){_startRename(sid);}
      });
    });
    /* ── Inline rename ── */
    function _startRename(sid){
      var s=_find(sid);if(!s)return;
      var item=el.querySelector('.chat-item[data-id="'+sid+'"]');if(!item)return;
      var titleSpan=item.querySelector('.chat-item-title');if(!titleSpan)return;
      var input=document.createElement('input');
      input.className='chat-item-edit';input.value=s.title;
      titleSpan.style.display='none';
      titleSpan.parentElement.insertBefore(input,titleSpan);
      input.focus();input.select();
      var committed=false;
      function commit(){
        if(committed)return;committed=true;
        var newTitle=input.value.trim();
        if(newTitle&&newTitle!==s.title){
          s.title=newTitle;_save();
          API.updateTitle(sid,newTitle).catch(function(){});
        }
        input.remove();titleSpan.style.display='';
        titleSpan.textContent=s.title;titleSpan.dataset.tip=s.title;
      }
      input.addEventListener('blur',commit);
      input.addEventListener('keydown',function(ev){
        if(ev.key==='Enter'){ev.preventDefault();commit();}
        if(ev.key==='Escape'){input.value=s.title;commit();}
      });
    }
    /* ── Load more button event ── */
    var lmBtn=document.getElementById('sbLoadMore');
    if(lmBtn){lmBtn.addEventListener('click',loadMore);}
  }
  function _startOfDay(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
  function _find(id){return _sessions.find(function(x){return x.id===id;});}
  function _save(){try{localStorage.setItem(K,JSON.stringify(_sessions.slice(0,20)));}catch(e){}}
  return{init:init,newSession:newSession,ensureSession:ensureSession,updateTitle:updateTitle,
    saveCurrentMessage:saveCurrentMessage,deleteSession:deleteSession,getActive:getActive,onNewChat:onNewChat,renderList:renderList,loadMore:loadMore};
})();

var VIZ=(function(){
  return {
    /**
     * visualization raw 객체를 표준형으로 정규화.
     * 입력 허용: {svg_code|code, title, chart_type}
     *   - svg_code: 현재 백엔드 표준 (Pydantic VisualizationData.svg_code)
     *   - code: 구 레코드 호환 (v4 이전 DB에 저장된 레거시 키)
     * 출력 표준형: {content, title, chart_type} | null
     */
    normalize:function(raw){
      if(!raw)return null;
      var content=raw.svg_code||raw.code||'';
      if(!content)return null;
      return {
        content:content,
        title:raw.title||'',
        chart_type:raw.chart_type||''
      };
    }
  };
})();
function sanitizeSVG(code){
  var doc=new DOMParser().parseFromString(code,'image/svg+xml');
  var svg=doc.querySelector('svg');if(!svg)return '';
  svg.querySelectorAll('script,foreignObject,iframe,embed,object').forEach(function(e){e.remove();});
  svg.querySelectorAll('*').forEach(function(el){
    Array.from(el.attributes).forEach(function(a){
      if(a.name.toLowerCase().startsWith('on')||a.value.includes('javascript:'))el.removeAttribute(a.name);
    });
    ['href','xlink:href'].forEach(function(attr){var v=el.getAttribute(attr);if(v&&v.trim().toLowerCase().startsWith('javascript:'))el.removeAttribute(attr);});
  });
  svg.querySelectorAll('[href],[xlink\\:href]').forEach(function(el){
    var href=el.getAttribute('href')||el.getAttribute('xlink:href')||'';
    if(href&&!href.startsWith('#')){el.removeAttribute('href');el.removeAttribute('xlink:href');}
  });
  return svg.outerHTML;
}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}

function mdRender(text){
  if(!text)return '';
  try{
    var html=marked.parse(text);
    /* XSS 방어: script, iframe, on* 이벤트 핸들러 제거 */
    var doc=new DOMParser().parseFromString(html,'text/html');
    doc.querySelectorAll('script,iframe,embed,object,style').forEach(function(e){e.remove();});
    doc.querySelectorAll('*').forEach(function(el){
      Array.from(el.attributes).forEach(function(a){
        if(a.name.toLowerCase().startsWith('on')||a.value.toLowerCase().includes('javascript:'))el.removeAttribute(a.name);
      });
    });
    return doc.body.innerHTML;
  }catch(e){return esc(text);}
}

function _svgToPNG(svgEl,cb){
  var rect=svgEl.getBoundingClientRect();
  var w=Math.max(1,Math.round(rect.width));
  var h=Math.max(1,Math.round(rect.height));
  if(w<=1||h<=1){
    var vb=(svgEl.getAttribute('viewBox')||'').split(/\s+/).map(Number);
    if(vb.length===4&&vb[2]>0&&vb[3]>0){w=Math.round(vb[2]);h=Math.round(vb[3]);}
  }
  var scale=2;
  var canvas=document.createElement('canvas');
  canvas.width=w*scale;canvas.height=h*scale;
  var ctx=canvas.getContext('2d');
  var clone=svgEl.cloneNode(true);
  clone.setAttribute('width',w);
  clone.setAttribute('height',h);
  if(!clone.getAttribute('xmlns'))clone.setAttribute('xmlns','http://www.w3.org/2000/svg');
  var svgData=new XMLSerializer().serializeToString(clone);
  var img=new Image();
  img.onload=function(){
    ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img,0,0,canvas.width,canvas.height);
    cb(canvas.toDataURL('image/png'));
  };
  img.onerror=function(){toast('이미지 변환 실패');};
  img.src='data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(svgData)));
}

        API.markDownload(msg.turnId).catch(function(){});
        MS.update(msg.id,{isDownloaded:true});
      }
    }).catch(function(err){toast('다운로드 실패: '+err.message);});
  }
};

/* ═══════════════════════════════════════
   Init
   ═══════════════════════════════════════ */
(function init(){
  /* Marked + Highlight.js 설정 (CDN 미로드 시에도 나머지 기능이 동작하도록 격리) */
  try{
    if(typeof hljs!=='undefined'){
      hljs.configure({languages:['python','sql','javascript','bash','json']});
    }
    if(typeof marked!=='undefined'){
      marked.setOptions({breaks:true,gfm:true});
      try{
        marked.setOptions({
          highlight:function(code,lang){
            if(typeof hljs==='undefined')return code;
            if(lang&&hljs.getLanguage(lang))return hljs.highlight(code,{language:lang}).value;
            return hljs.highlightAuto(code).value;
          }
        });
      }catch(e){/* highlight option deprecated in marked v5+ — GFM/breaks still applied */}
    }
  }catch(e){console.warn('marked/hljs 설정 실패:',e);}

  /* 모듈 초기화 */
  TM.init();
  SB.init(); /* async — runs in background */
  CM.init();
  CN.connect();

  /* 이벤트 바인딩 */
  var inp=document.getElementById('messageInput'),
      btn=document.getElementById('sendBtn');

  /* #14 — IME 조합 중 버튼 상태 지연 방지 */
  inp.addEventListener('compositionend',function(){btn.disabled=!inp.value.trim()||btn.classList.contains('cancel');});
  inp.addEventListener('input',function(){resizeTA();btn.disabled=!inp.value.trim()||btn.classList.contains('cancel');});
  /* #1 — Enter 처리는 CM._onKey에서 통합 관리, 여기서는 바인딩하지 않음 */
  btn.addEventListener('click',function(){btn.classList.contains('cancel')?App.cancelStream():App.sendMessage();});
  /* #6 — 새 대화: 기존 대화 보존 + 새 세션 / 초기화: 현재 대화 삭제 확인 */
  document.getElementById('newBtn').addEventListener('click',function(){SB.onNewChat();});
  /* ── 사이드바 ··· 메뉴: 바깥 클릭 시 닫기 ── */
  document.addEventListener('click',function(e){if(!e.target.closest('.chat-item-more')&&!e.target.closest('.chat-item-menu')){document.querySelectorAll('.chat-item-menu.open').forEach(function(m){m.classList.remove('open');});}});
  /* #12, #13 — 사이드바 토글 + 모바일 backdrop + 상태 저장 */
  var sbBackdrop=document.getElementById('sbBackdrop');
  function closeSidebar(){
    var sb=document.getElementById('sidebar');
    sb.classList.add('collapsed');sb.classList.remove('mobile-open');
    sbBackdrop.classList.remove('show');
    try{localStorage.setItem('dc-sb-collapsed','1');}catch(e){}
  }
  function openSidebar(){
    var sb=document.getElementById('sidebar');
    sb.classList.remove('collapsed');sb.classList.add('mobile-open');
    sbBackdrop.classList.add('show');
    try{localStorage.removeItem('dc-sb-collapsed');}catch(e){}
  }
  document.getElementById('togSb').addEventListener('click',function(){
    document.getElementById('sidebar').classList.contains('collapsed')?openSidebar():closeSidebar();
  });
  sbBackdrop.addEventListener('click',closeSidebar);
  /* #13 — 저장된 사이드바 상태 복원 */
  try{if(localStorage.getItem('dc-sb-collapsed'))document.getElementById('sidebar').classList.add('collapsed');}catch(e){}
  document.getElementById('themeBtn').addEventListener('click',function(){TM.toggle();});

  /* #11 — 스트리밍 중 사용자 스크롤업 감지 + 스크롤 맨아래로 버튼 */
  var chatWrapEl=document.getElementById('chatWrap');
  var scrollBottomBtn=document.getElementById('scrollBottomBtn');
  chatWrapEl.addEventListener('wheel',function(e){
    if(e.deltaY<0)_userScrolledUp=true;
    else if(chatWrapEl.scrollHeight-chatWrapEl.scrollTop-chatWrapEl.clientHeight<10)_userScrolledUp=false;
  },{passive:true});
  chatWrapEl.addEventListener('scroll',function(){
    var gap=chatWrapEl.scrollHeight-chatWrapEl.scrollTop-chatWrapEl.clientHeight;
    if(gap>100){scrollBottomBtn.style.display='flex';_userScrolledUp=true;}
    else{scrollBottomBtn.style.display='none';_userScrolledUp=false;}
  },{passive:true});
  scrollBottomBtn.addEventListener('click',function(){
    _userScrolledUp=false;
    chatWrapEl.scrollTo({top:chatWrapEl.scrollHeight,behavior:'smooth'});
    scrollBottomBtn.style.display='none';
  });

  /* ── 스트리밍 토글 버튼 (입력창 왼쪽) ── */
  document.getElementById('streamToggle').addEventListener('click',function(){
    var cur=_pref('pref-streaming','on');
    var next=cur==='on'?'off':'on';
    _setPref('pref-streaming',next);
    _syncStreamToggle();
    toast(next==='on'?'스트리밍 응답 켜짐':'스트리밍 응답 꺼짐');
  });

  /* 설정 모달 */
  /* ── 설정 유틸 ── */
  function _pref(k,d){try{return localStorage.getItem(k)||d;}catch(e){return d;}}
  function _setPref(k,v){try{localStorage.setItem(k,v);}catch(e){}}
  function _applyPrefs(){
    var cw=_pref('pref-chat-width','700');
    document.documentElement.style.setProperty('--mx',cw+'px');
    var lh=_pref('pref-line-height','1.6');
    document.documentElement.style.setProperty('--line-height',lh);
    var cf=_pref('pref-code-font','13');
    document.documentElement.style.setProperty('--code-fs',cf+'px');
    _syncStreamToggle();
  }
  function _syncStreamToggle(){
    var btn=document.getElementById('streamToggle');if(!btn)return;
    var on=_pref('pref-streaming','on')==='on';
    btn.classList.toggle('on',on);
    btn.title=on?'스트리밍 응답 켜짐 (클릭하여 끄기)':'스트리밍 응답 꺼짐 (클릭하여 켜기)';
  }
  var _setInit={};
  document.getElementById('openSetBtn').addEventListener('click',function(){
    _setInit={theme:TM.get(),fs:_pref('dc-fontsize','14'),
      cw:_pref('pref-chat-width','700'),lh:_pref('pref-line-height','1.6'),
      cf:_pref('pref-code-font','13'),as:_pref('pref-auto-scroll','on'),
      sd:_pref('pref-sql-display','fold'),tc:_pref('pref-table-copy','tsv'),
      st:_pref('pref-streaming','on')};
    document.getElementById('setTheme').value=_setInit.theme;
    document.getElementById('setFontSize').value=_setInit.fs;
    document.getElementById('setChatWidth').value=_setInit.cw;
    document.getElementById('setLineHeight').value=_setInit.lh;
    document.getElementById('setCodeFont').value=_setInit.cf;
    document.getElementById('setAutoScroll').value=_setInit.as;
    document.getElementById('setSqlDisplay').value=_setInit.sd;
    document.getElementById('setTableCopy').value=_setInit.tc;
    document.getElementById('setStreaming').value=_setInit.st;
    document.getElementById('setModal').classList.add('open');
  });
  document.getElementById('cancelSetBtn').addEventListener('click',function(){document.getElementById('setModal').classList.remove('open');});
  document.getElementById('saveSetBtn').addEventListener('click',function(){
    TM.set(document.getElementById('setTheme').value);
    var fs=document.getElementById('setFontSize').value;
    document.documentElement.style.fontSize=fs+'px';
    _setPref('dc-fontsize',fs);
    _setPref('pref-chat-width',document.getElementById('setChatWidth').value);
    _setPref('pref-line-height',document.getElementById('setLineHeight').value);
    _setPref('pref-code-font',document.getElementById('setCodeFont').value);
    _setPref('pref-auto-scroll',document.getElementById('setAutoScroll').value);
    _setPref('pref-sql-display',document.getElementById('setSqlDisplay').value);
    _setPref('pref-table-copy',document.getElementById('setTableCopy').value);
    _setPref('pref-streaming',document.getElementById('setStreaming').value);
    _applyPrefs();
    document.getElementById('setModal').classList.remove('open');
    toast('설정 저장됨');
  });
  /* #8 — backdrop 클릭 시 변경사항 확인 */
  document.getElementById('setModal').addEventListener('click',function(e){
    if(e.target.id!=='setModal')return;
    var dirty=document.getElementById('setTheme').value!==_setInit.theme
      ||document.getElementById('setFontSize').value!==_setInit.fs
      ||document.getElementById('setChatWidth').value!==_setInit.cw
      ||document.getElementById('setLineHeight').value!==_setInit.lh
      ||document.getElementById('setCodeFont').value!==_setInit.cf
      ||document.getElementById('setAutoScroll').value!==_setInit.as
      ||document.getElementById('setSqlDisplay').value!==_setInit.sd
      ||document.getElementById('setTableCopy').value!==_setInit.tc
      ||document.getElementById('setStreaming').value!==_setInit.st;
    if(dirty){
      showConfirm({title:'설정 닫기',message:'변경사항을 저장하지 않고 닫으시겠습니까?',okText:'닫기',danger:false,onOk:function(){
        document.getElementById('setModal').classList.remove('open');
      }});
      return;
    }
    document.getElementById('setModal').classList.remove('open');
  });
  /* ── 확인 모달 이벤트 ── */
  document.getElementById('confirmOk').addEventListener('click',_acceptConfirm);
  document.getElementById('confirmCancel').addEventListener('click',_closeConfirm);
  document.getElementById('confirmModal').addEventListener('click',function(e){if(e.target.id==='confirmModal')_closeConfirm();});

  /* ── 모든 모달 공통 키보드 단축키 (Esc/Enter) ── */
  document.addEventListener('keydown',function(e){
    /* 확인 모달이 최우선 (가장 위에 뜨므로) */
    var cm=document.getElementById('confirmModal');
    if(cm.classList.contains('open')){
      if(e.key==='Escape'){e.preventDefault();_closeConfirm();return;}
      if(e.key==='Enter'){e.preventDefault();_acceptConfirm();return;}
    }
    /* 설정 모달 */
    var sm=document.getElementById('setModal');
    if(sm.classList.contains('open')){
      if(e.key==='Escape'){e.preventDefault();sm.classList.remove('open');return;}
      if(e.key==='Enter'&&e.target.tagName!=='SELECT'){e.preventDefault();document.getElementById('saveSetBtn').click();return;}
    }
    /* 피드백 팝업 */
    var fb=document.querySelector('.feedback-overlay');
    if(fb&&e.key==='Escape'){fb.remove();return;}
    /* 차트 모달 */
    if(e.key==='Escape'){var chartModal=document.querySelector('.chart-modal');if(chartModal)chartModal.remove();}
    /* ── Keyboard shortcuts: Ctrl+Shift+N/Up/Down/Backspace ── */
    if(e.ctrlKey&&e.shiftKey){
      if(e.key==='N'||e.key==='n'){e.preventDefault();SB.onNewChat();return;}
      if(e.key==='ArrowUp'||e.key==='ArrowDown'){
        e.preventDefault();
        /* Navigate sessions */
        var items=document.querySelectorAll('#chatList .chat-item:not(.skeleton)');
        if(!items.length)return;
        var curIdx=-1;
        items.forEach(function(item,i){if(item.classList.contains('active'))curIdx=i;});
        if(e.key==='ArrowUp')curIdx=curIdx<=0?items.length-1:curIdx-1;
        else curIdx=curIdx>=items.length-1?0:curIdx+1;
        items[curIdx].click();
        return;
      }
      if(e.key==='Backspace'){
        e.preventDefault();
        var activeId=SB.getActive();
        if(activeId)SB.deleteSession(activeId);
        return;
      }
    }
  });

  /* 저장된 폰트 크기 및 사용자 설정 적용 */
  try{var fs=localStorage.getItem('dc-fontsize');if(fs)document.documentElement.style.fontSize=fs+'px';}catch(e){}
  _applyPrefs();

  /* ══ 커스텀 툴팁 (fixed position — overflow:hidden 우회) ══ */
  var _tip=null,_tipTimer=null,_tipEl=null;
  function _hideTip(){clearTimeout(_tipTimer);if(_tip){_tip.remove();_tip=null;}_tipEl=null;}
  function _showTip(el){
    _hideTip();_tipEl=el;
    _tipTimer=setTimeout(function(){
      if(_tipEl!==el)return;
      _tip=document.createElement('div');
      _tip.className='tip';
      _tip.textContent=el.dataset.tip;
      document.body.appendChild(_tip);
      var r=el.getBoundingClientRect();
      var tx=r.left,ty=r.bottom+6;
      if(tx+_tip.offsetWidth>window.innerWidth)tx=window.innerWidth-_tip.offsetWidth-8;
      if(ty+_tip.offsetHeight>window.innerHeight)ty=r.top-_tip.offsetHeight-6;
      _tip.style.left=tx+'px';_tip.style.top=ty+'px';
    },400);
  }
  document.addEventListener('mouseover',function(e){
    var el=e.target.closest('.chat-item-title[data-tip]');
    if(!el||el.scrollWidth<=el.clientWidth){if(_tipEl&&!e.target.closest('.chat-item-title'))_hideTip();return;}
    if(el===_tipEl)return;
    _showTip(el);
  });
  document.addEventListener('mouseleave',function(){_hideTip();},true);
})();

})();
</script>
