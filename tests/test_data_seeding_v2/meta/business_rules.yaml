# 메타 정보
# ════════════════════════════════════════════
meta:
  total_rules: 70  # 대략 (실제는 아래 자동 집계)
  categories:
    - date_order_rules
    - amount_rules
    - status_rules
    - cross_table_rules
    - code_rules
    - cardinality_hard_limits
    - computed_rules
    - quality_defect_tolerances
  coverage:
    domains_covered: [CSC, CSI, CSK, DPG, DPF, DPD, DPB, DPN, DPY,
                      LNB, LNH, LNJ, LNC, LNK, LNW, LNO, LNM, LNG,
                      CLN, SLE,
                      RPC, RPD, RPI, TRS, FND, DRV,
                      FXC, FXR, FXD,
                      EBB, EBM, EBS, EBA, EBO,
                      RSK, AML, MKT, FNA, MVP, MVN]
  usage_notes:
    - "severity=hard 규칙은 시딩 시 반드시 만족"
    - "severity=soft 규칙은 권고 수준 (95% 이상 만족 권장)"
    - "quality_defect 카테고리는 의도적 위반 허용 (v2 특성)"
    - "cross_table 규칙은 시딩 후 SQL 검증 필수"
    - "computed 규칙은 시딩 시 자동 계산하거나 시딩 후 UPDATE"
