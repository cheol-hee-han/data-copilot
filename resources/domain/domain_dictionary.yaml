  # === 시간 표현 보강 ===
  - term: 전년동기
    aliases: [전년동기간, 작년같은기간, YoY, year over year]
    condition: "BETWEEN DATE_TRUNC('year', CURRENT_DATE) - INTERVAL '1 year' AND (DATE_TRUNC('year', CURRENT_DATE) - INTERVAL '1 year') + (CURRENT_DATE - DATE_TRUNC('year', CURRENT_DATE))"
    description: 전년도 같은 기간. 올해 1월 1일~현재와 동일한 작년 구간
    category: 시간

  - term: 전년동월
    aliases: [작년같은달, 전년동월비교, 전년동월대비]
    condition: "BETWEEN DATE_TRUNC('month', CURRENT_DATE - INTERVAL '1 year') AND DATE_TRUNC('month', CURRENT_DATE - INTERVAL '1 year') + INTERVAL '1 month' - INTERVAL '1 day'"
    description: 전년도의 같은 달(월). 작년 동월 1일~말일
    category: 시간

  - term: 직전영업일
    aliases: ["어제(영업일기준)", 전영업일, 전일]
    condition: "= (SELECT MAX(BSNS_DT) FROM TB_BSNS_DAY WHERE BSNS_DT < CURRENT_DATE AND HLDY_YN = 'N')"
    description: "가장 최근 영업일. 공휴일·주말을 제외한 직전 거래 가능 날짜. TB_BSNS_DAY 영업일 테이블 필요"
    category: 시간

  - term: 월초
    aliases: [이달초, 월초일, 당월초]
    condition: "= DATE_TRUNC('month', CURRENT_DATE)"
    description: 현재 월의 첫째 날 (1일)
    category: 시간

  - term: 월말
    aliases: [이달말, 월말일, 당월말]
    condition: "= DATE_TRUNC('month', CURRENT_DATE) + INTERVAL '1 month' - INTERVAL '1 day'"
    description: 현재 월의 마지막 날
    category: 시간

  - term: 분기초
    aliases: [당분기초, 이번분기초]
    condition: "= DATE_TRUNC('quarter', CURRENT_DATE)"
    description: 현재 분기의 첫째 날 (1월·4월·7월·10월 1일)
    category: 시간

  - term: 분기말
    aliases: [당분기말, 이번분기말]
    condition: "= DATE_TRUNC('quarter', CURRENT_DATE) + INTERVAL '3 months' - INTERVAL '1 day'"
    description: 현재 분기의 마지막 날 (3월·6월·9월·12월 말일)
    category: 시간

  - term: 이번 분기
    aliases: [당분기, 현재분기, 금분기]
    condition: ">= DATE_TRUNC('quarter', CURRENT_DATE)"
    description: 현재 분기 시작일부터 현재까지
    category: 시간

  - term: 상반기
    aliases: [1반기, 전반기, H1]
    condition: "BETWEEN DATE_TRUNC('year', CURRENT_DATE) AND DATE_TRUNC('year', CURRENT_DATE) + INTERVAL '6 months' - INTERVAL '1 day'"
    description: 해당 연도의 1월 1일 ~ 6월 30일
    category: 시간

  - term: 하반기
    aliases: [2반기, 후반기, H2]
    condition: "BETWEEN DATE_TRUNC('year', CURRENT_DATE) + INTERVAL '6 months' AND DATE_TRUNC('year', CURRENT_DATE) + INTERVAL '1 year' - INTERVAL '1 day'"
    description: 해당 연도의 7월 1일 ~ 12월 31일
    category: 시간

  - term: 지난해
    aliases: [작년, 전년, 전년도, 지난년도]
    condition: "BETWEEN DATE_TRUNC('year', CURRENT_DATE) - INTERVAL '1 year' AND DATE_TRUNC('year', CURRENT_DATE) - INTERVAL '1 day'"
    description: 직전 연도 1월 1일 ~ 12월 31일
    category: 시간

  - term: 회계연도
    aliases: [결산연도, fiscal year, FY]
    condition: "EXTRACT(YEAR FROM ACCT_DT) = EXTRACT(YEAR FROM CURRENT_DATE)"
    description: "회계 결산 기준 연도. 은행 회계연도는 통상 1월 1일 ~ 12월 31일. 컬럼명은 ACCT_DT 또는 BASE_YM 등 테이블마다 상이"
    category: 시간

  - term: 기준일
    aliases: [기준날짜, 기준시점, base date, 기준년월일]
    table_name: ""
    column_name: STD_DT
    description: "데이터 적재 또는 집계 기준이 되는 날짜. 정보계 테이블의 STD_DT, BASE_DT 등 컬럼에 해당"
    category: 시간

