# ============================================================
# 파일: resources/domain/domain_dictionary.yaml
# 용도: 금융 도메인 용어 사전 (자연어 표현 → DB 스키마 매핑)
# 적용: src/services/domain/domain_dictionary.py 에서 모듈 로드 시 자동 반영
#
# 이 파일이 존재하면 코드 내장 기본 사전 대신 이 파일을 사용합니다.
# 이 파일이 없으면 domain_dictionary.py의 기본값으로 동작합니다.
#
# 실제 DB 스키마: PostgreSQL biz_schema
#   TB_ADW_CSC101M  - 고객마스터 (CUS)
#   TB_ADW_CSC102H  - 고객이력 (CUS)
#   TB_ADW_CSP103M  - 고객프로파일 (CUS)
#   TB_ADW_LNB301M  - 여신마스터 (LON)
#   TB_ADW_LNB302M  - 여신승인정보 (LON)
#   TB_ADW_DEP201P  - 수신마스터 (DEP)
#   TB_ADW_DEP202S  - 수신요약 (DEP)
#   TB_ADW_CRD401M  - 카드마스터 (CRD)
#   TB_ADW_TRX701L  - 거래내역 (TRX)
#   TB_ADW_COM001M  - 지점정보 (COM)
#   TB_ADW_FXB502M  - 환율정보 (FX)
#
# 카테고리 목록:
#   고객      - 고객 유형, 등급, 상태
#   여신      - 대출 상품, 자산건전성, 연체 관련
#   수신      - 예금 상품, 금리, 잔액 관련
#   거래      - 입출금, 이체 등 거래 유형
#   카드      - 신용/체크카드, 이용 관련
#   외환      - 환율, 외화예금, 해외송금
#   금융지표  - NIM, BIS, LCR 등 경영/건전성 지표
#   조직      - 지점, 부서 등 조직 정보
#   시간      - 당월/전월 등 기간 표현
# ============================================================

terms:
  # === 고객 관련 ===
  - term: 신규 고객
    aliases: [신규고객, 새 고객, 신규 가입, 새로 가입]
    table_name: TB_ADW_CSC101M
    column_name: JOIN_DT
    condition: "JOIN_DT >= DATE_TRUNC('month', CURRENT_DATE)"
    description: 해당 기간 내 신규 등록된 고객
    category: 고객

  - term: 개인 고객
    aliases: [개인고객, 개인, 리테일]
    table_name: TB_ADW_CSC101M
    column_name: CUS_DCD
    condition: "CUS_DCD = '01'"
    description: 개인 고객 유형
    category: 고객

  - term: 기업 고객
    aliases: [기업고객, 기업, 법인, 법인고객]
    table_name: TB_ADW_CSC101M
    column_name: CUS_DCD
    condition: "CUS_DCD = '02'"
    description: 기업 고객 유형
    category: 고객

  # === 여신(대출) 관련 ===
  - term: 여신
    aliases: [대출, 론, 대여금, 여신거래]
    table_name: TB_ADW_LNB301M
    description: 대출 관련 데이터
    category: 여신

  - term: 신용대출
    aliases: [신용여신, 무담보대출, 신용론]
    table_name: TB_ADW_LNB301M
    column_name: LN_DCD
    condition: "LN_DCD = '01'"
    category: 여신

  - term: 담보대출
    aliases: [담보여신, 유담보대출, 주담대, 주택담보대출]
    table_name: TB_ADW_LNB301M
    column_name: LN_DCD
    condition: "LN_DCD = '02'"
    category: 여신

  - term: 보증대출
    aliases: [보증여신, 보증부대출]
    table_name: TB_ADW_LNB301M
    column_name: LN_DCD
    condition: "LN_DCD = '03'"
    category: 여신

  - term: 연체
    aliases: [연체대출, 미상환, 부실]
    table_name: TB_ADW_LNB301M
    column_name: OVDU_DY_CN
    condition: "OVDU_DY_CN > 0"
    description: 연체일수가 1일 이상인 여신. OVDU_GRD_CD로 등급 확인 가능
    category: 여신

  - term: 대출 실행
    aliases: [대출실행, 여신실행, 대출 집행, 신규 대출]
    table_name: TB_ADW_LNB301M
    column_name: LN_DT
    description: 대출이 실행된 건
    category: 여신

  # === 수신(예금) 관련 ===
  - term: 수신
    aliases: [예금, 예적금, 수신거래]
    table_name: TB_ADW_DEP201P
    description: 예금 관련 데이터
    category: 수신

  - term: 예금 잔액
    aliases: [수신잔액, 잔액, 잔고, 예금잔고]
    table_name: TB_ADW_DEP201P
    column_name: BAL_AMT
    description: 계좌 잔액 합계
    category: 수신

  - term: 정상 계좌
    aliases: [활성계좌, 살아있는 계좌]
    table_name: TB_ADW_DEP201P
    column_name: ACT_STCD
    condition: "ACT_STCD = '01'"
    category: 수신

  - term: 휴면 계좌
    aliases: [휴면, 장기미거래계좌]
    table_name: TB_ADW_DEP201P
    column_name: ACT_STCD
    condition: "ACT_STCD = '03'"
    category: 수신

  # === 거래 관련 ===
  - term: 입금
    aliases: [입금거래, 자금유입]
    table_name: TB_ADW_TRX701L
    column_name: TR_DCD
    condition: "TR_DCD = '01'"
    category: 거래

  - term: 출금
    aliases: [출금거래, 자금유출, 인출]
    table_name: TB_ADW_TRX701L
    column_name: TR_DCD
    condition: "TR_DCD = '02'"
    category: 거래

  - term: 이체
    aliases: [계좌이체, 송금, 자금이체]
    table_name: TB_ADW_TRX701L
    column_name: TR_DCD
    condition: "TR_DCD = '03'"
    category: 거래

  # === 지점 관련 ===
  - term: 지점
    aliases: [영업점, 부점, 점포]
    table_name: TB_ADW_COM001M
    description: 지점 정보
    category: 조직

  # === 시간 관련 ===
  - term: 이번 달
    aliases: [금월, 당월, 이달]
    condition: ">= DATE_TRUNC('month', CURRENT_DATE)"
    description: 현재 월 시작일부터
    category: 시간

  - term: 지난 달
    aliases: [전월, 작달, 지난달]
    condition: "BETWEEN DATE_TRUNC('month', CURRENT_DATE) - INTERVAL '1 month' AND DATE_TRUNC('month', CURRENT_DATE) - INTERVAL '1 day'"
    description: 전월 1일~말일
    category: 시간

  - term: 올해
    aliases: [금년, 당해, 이번 해]
    condition: ">= DATE_TRUNC('year', CURRENT_DATE)"
    description: 현재 연도 시작일부터
    category: 시간

  - term: 지난 분기
    aliases: [전분기, 직전분기]
    condition: "BETWEEN DATE_TRUNC('quarter', CURRENT_DATE) - INTERVAL '3 months' AND DATE_TRUNC('quarter', CURRENT_DATE) - INTERVAL '1 day'"
    description: 직전 분기
    category: 시간

  # ---------------------------------------------------------------
  # 아래는 보강 용어 (2026-03-18 추가)
  # ---------------------------------------------------------------

  # === 고객 심화 ===
  - term: VIP 고객
    aliases: [VIP, 우수고객, 프리미엄고객, 우량고객, TOP고객]
    table_name: TB_ADW_CSC101M
    column_name: CUS_GRD_CD
    condition: "CUS_GRD_CD IN ('VIP', 'VVIP', '01', '02')"
    description: 은행 내부 기준 우수 등급 고객. 정확한 코드값은 코드 메타 참조
    category: 고객

  - term: 일반 고객
    aliases: [일반고객, 일반등급, 비우수고객]
    table_name: TB_ADW_CSC101M
    column_name: CUS_GRD_CD
    condition: "CUS_GRD_CD NOT IN ('VIP', 'VVIP', '01', '02')"
    description: VIP 이외의 일반 등급 고객
    category: 고객

  - term: 휴면 고객
    aliases: [장기미거래고객, 비활성고객, 미거래고객]
    table_name: TB_ADW_CSC101M
    column_name: CUST_STATUS_CD
    condition: "CUST_STATUS_CD = '03'"
    description: 일정 기간(통상 1년) 이상 거래가 없는 고객
    category: 고객

  - term: 탈퇴 고객
    aliases: [해지고객, 이탈고객, 거래종료고객]
    table_name: TB_ADW_CSC101M
    column_name: CUST_STATUS_CD
    condition: "CUST_STATUS_CD = '09'"
    description: 모든 거래를 해지하고 탈퇴한 고객
    category: 고객

  # === 여신 심화 ===
  - term: 가계대출
    aliases: [가계여신, 개인대출, 소매대출, 리테일대출]
    table_name: TB_ADW_LNB301M
    column_name: LOAN_SECTOR_CD
    condition: "LOAN_SECTOR_CD = '10'"
    description: 개인(가계)을 대상으로 실행된 대출. 주택담보, 신용, 전세 등 포함
    category: 여신

  - term: 기업대출
    aliases: [기업여신, 법인대출, 기업금융, corporate loan]
    table_name: TB_ADW_LNB301M
    column_name: LOAN_SECTOR_CD
    condition: "LOAN_SECTOR_CD = '20'"
    description: 기업(법인·개인사업자)을 대상으로 실행된 대출
    category: 여신

  - term: 주택담보대출
    aliases: [주담대, 아파트담보대출, 부동산담보대출, 주택저당대출, 모기지]
    table_name: TB_ADW_LNB301M
    column_name: LN_DCD
    condition: "LN_DCD = '11'"
    description: 주택(아파트·단독주택 등)을 담보로 제공하고 받는 대출
    category: 여신

  - term: 전세대출
    aliases: [전세자금대출, 전세보증대출, 임차보증금대출]
    table_name: TB_ADW_LNB301M
    column_name: LN_DCD
    condition: "LN_DCD = '12'"
    description: 전세 보증금을 마련하기 위한 목적성 대출
    category: 여신

  - term: 정책자금대출
    aliases: [정책대출, 정부지원대출, 기금대출, 햇살론, 새희망홀씨]
    table_name: TB_ADW_LNB301M
    column_name: LN_DCD
    condition: "LN_DCD = '30'"
    description: 정부·공공기금 재원으로 취약계층·소상공인에게 지원하는 대출
    category: 여신

  - term: 한도대출
    aliases: [마이너스통장, 마통, 한도성대출, 한도여신, credit line]
    table_name: TB_ADW_LNB301M
    column_name: LN_DCD
    condition: "LN_DCD = '40'"
    description: 약정 한도 내에서 자유롭게 인출·상환할 수 있는 대출(마이너스통장 포함)
    category: 여신

  - term: 여신 잔액
    aliases: [대출잔액, 여신잔고, 대출금잔액, outstanding]
    table_name: TB_ADW_LNB301M
    column_name: LN_BAL_AMT
    description: 현재 시점 미상환 대출 원금 잔액
    category: 여신

  - term: 여신 만기
    aliases: [대출만기, 만기일, 여신만기일, 상환기일]
    table_name: TB_ADW_LNB301M
    column_name: MTRTY_DT
    description: 대출 원금 전액을 상환해야 하는 기일
    category: 여신

  - term: 만기도래
    aliases: [만기예정, 만기도래여신, 만기임박]
    table_name: TB_ADW_LNB301M
    column_name: MTRTY_DT
    condition: "MTRTY_DT BETWEEN CURRENT_DATE AND CURRENT_DATE + INTERVAL '30 days'"
    description: 30일 이내 만기가 도래하는 여신. 기간은 업무 요건에 따라 조정
    category: 여신

  - term: 1개월 이상 연체
    aliases: [1개월연체, 30일이상연체, 단기연체]
    table_name: TB_ADW_LNB301M
    column_name: OVDU_DY_CN
    condition: "OVDU_DY_CN >= 30"
    description: 상환 지연 기간이 30일 이상인 여신
    category: 여신

  - term: 3개월 이상 연체
    aliases: [3개월연체, 90일이상연체, 중기연체]
    table_name: TB_ADW_LNB301M
    column_name: OVDU_DY_CN
    condition: "OVDU_DY_CN >= 90"
    description: 상환 지연 기간이 90일 이상인 여신
    category: 여신

  - term: 6개월 이상 연체
    aliases: [6개월연체, 180일이상연체, 장기연체]
    table_name: TB_ADW_LNB301M
    column_name: OVDU_DY_CN
    condition: "OVDU_DY_CN >= 180"
    description: 상환 지연 기간이 180일 이상인 장기 연체 여신
    category: 여신

  # 자산건전성 분류
  - term: 정상여신
    aliases: [정상자산, 건전여신]
    table_name: TB_ADW_LNB301M
    column_name: ASSET_HLTH_CD
    condition: "ASSET_HLTH_CD = '10'"
    description: "자산건전성 분류 1단계. 채무상환 능력이 양호하고 연체 없는 여신"
    category: 여신

  - term: 요주의
    aliases: [요주의여신, 요주의자산]
    table_name: TB_ADW_LNB301M
    column_name: ASSET_HLTH_CD
    condition: "ASSET_HLTH_CD = '20'"
    description: 자산건전성 분류 2단계. 1개월 이상 3개월 미만 연체 또는 잠재적 부실 가능성 있는 여신
    category: 여신

  - term: 고정
    aliases: [고정여신, 고정자산, 부실여신]
    table_name: TB_ADW_LNB301M
    column_name: ASSET_HLTH_CD
    condition: "ASSET_HLTH_CD = '30'"
    description: 자산건전성 분류 3단계. 3개월 이상 연체 또는 채무상환 불가 가능성이 높은 여신
    category: 여신

  - term: 회수의문
    aliases: [회수의문여신, 회수의문자산]
    table_name: TB_ADW_LNB301M
    column_name: ASSET_HLTH_CD
    condition: "ASSET_HLTH_CD = '40'"
    description: 자산건전성 분류 4단계. 회수 가능성이 매우 낮은 여신
    category: 여신

  - term: 추정손실
    aliases: [추정손실여신, 추정손실자산, 상각여신]
    table_name: TB_ADW_LNB301M
    column_name: ASSET_HLTH_CD
    condition: "ASSET_HLTH_CD = '50'"
    description: 자산건전성 분류 5단계. 회수 불능으로 판단되어 손실 처리가 필요한 여신
    category: 여신

  - term: 부실채권
    aliases: [NPL, 고정이하여신, 부실자산, 부실여신]
    table_name: TB_ADW_LNB301M
    column_name: ASSET_HLTH_CD
    condition: "ASSET_HLTH_CD IN ('30', '40', '50')"
    description: "자산건전성 분류 고정 이하(고정·회수의문·추정손실)에 해당하는 여신. NPL(Non-Performing Loan)"
    category: 여신

  - term: 충당금
    aliases: [대손충당금, 충당금적립, loan loss reserve]
    table_name: TB_LOAN_RESERVE
    column_name: RESERVE_AMT
    description: 부실 가능성에 대비하여 자산건전성 분류별로 적립하는 손실 준비금
    category: 여신

  # === 수신 심화 ===
  - term: 요구불예금
    aliases: [요구불, 보통예금, 당좌예금, 수시입출금]
    table_name: TB_ADW_DEP201P
    column_name: ACT_DCD
    condition: "ACT_DCD IN ('10', '11', '12')"
    description: 만기 없이 언제든지 입출금이 가능한 예금. 보통예금·당좌예금 포함
    category: 수신

  - term: 저축성예금
    aliases: [정기예금, 정기적금, 적금, 목돈마련]
    table_name: TB_ADW_DEP201P
    column_name: ACT_DCD
    condition: "ACT_DCD IN ('20', '21', '22')"
    description: 일정 기간 예치하는 만기형 예금. 정기예금·정기적금 포함
    category: 수신

  - term: MMDA
    aliases: [시장금리부수시입출금식예금, Money Market Deposit Account]
    table_name: TB_ADW_DEP201P
    column_name: ACT_DCD
    condition: "ACT_DCD = '13'"
    description: 시장금리를 적용하는 수시입출금식 예금. 요구불이지만 잔액에 따라 차등금리 적용
    category: 수신

  - term: CD
    aliases: [양도성예금증서, Certificate of Deposit]
    table_name: TB_ADW_DEP201P
    column_name: ACT_DCD
    condition: "ACT_DCD = '30'"
    description: 제3자에게 양도 가능한 만기부 예금증서. 시장 금리 지표로도 활용
    category: 수신

  - term: RP
    aliases: [환매조건부채권, repo, 레포, Repurchase Agreement]
    table_name: TB_ADW_DEP201P
    column_name: ACT_DCD
    condition: "ACT_DCD = '40'"
