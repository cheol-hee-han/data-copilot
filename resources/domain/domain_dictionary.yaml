    description: "연체율. 산출식: 연체원금 / 총 여신 원금 잔액 x 100. 1개월 이상 연체 기준 적용이 일반적이나 3개월·6개월 기준도 사용"
    category: 금융지표

  - term: 고정이하여신비율
