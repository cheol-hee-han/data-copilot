# ============================================================
# 파일: resources/visualization/chart_config.yaml
# 용도: SVG 차트 생성 시 폰트·색상·레이아웃 설정
# 적용: src/analysis/chart_generator.py 와
#       prompts/system_prompts.py VISUALIZATION_SVG_GENERATION에 자동 반영
# 대상: customization-targets.md #17 (SVG 시각화 폰트)
#
# 이 파일이 존재하면 코드 내장 설정 대신 이 파일을 사용합니다.
# 이 파일이 없으면 chart_generator.py의 기본 설정으로 동작합니다.
# ============================================================

fonts:
  primary: "Malgun Gothic"
  fallback: "맑은 고딕"
  system: sans-serif
  # 리눅스 서버인 경우 아래로 변경:
  # primary: "Noto Sans KR"
  # fallback: "NanumGothic"

colors:
  primary: "#1a56db"
  palette:
    - "#1a56db"
    - "#3b82f6"
    - "#60a5fa"
    - "#93c5fd"
    - "#f59e0b"
    - "#10b981"
    - "#ef4444"

chart:
  viewbox: "0 0 600 400"
  min_rows_for_viz: 3
