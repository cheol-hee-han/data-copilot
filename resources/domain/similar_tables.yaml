# ============================================================
# 파일: resources/domain/similar_tables.yaml
# 용도: 유사 테이블 그룹 정의 (테이블 선택 정확도 향상)
# 적용: src/knowledge/table_selector.py 에서 모듈 로드 시 자동 반영
# 대상: customization-targets.md #8 (유사 테이블 그룹 재정의)
#
# 이 파일이 존재하면 코드 내장 그룹 정의 대신 이 파일을 사용합니다.
# 이 파일이 없으면 table_selector.py의 기본 그룹으로 동작합니다.
# ============================================================

groups:
  - group_id: loan_overdue
    domain: 여신
    description: 대출 연체 관련 테이블 그룹
    disambiguation_rule: "건별 현황/목록/건수 → TB_LOAN_INFO, 연체율/추이/통계/비율 산출 → TB_LOAN_OVERDUE_STAT"
    tables:
      TB_LOAN_INFO:
        purpose: "건별 현재 대출 상태 (개별 대출의 연체 여부, 금액, 금리)"
        update_cycle: 일배치
        suitable_for:
          - 현재 연체 중인 대출 건수
          - 개별 대출 목록
          - 연체 대출의 평균 금리
        unsuitable_for:
          - 월별 연체율 추이
          - 지점별 연체율 통계
          - 연체율 산출
        signal_keywords: [건수, 목록, 리스트, 건별, 개별, 현재, 지금, 금리, 잔액]

      TB_LOAN_OVERDUE_STAT:
        purpose: "월말 기준 연체 통계 집계 (지점별/유형별 연체율, 연체금액)"
        update_cycle: 월배치
        suitable_for:
          - 연체율 추이
          - 지점별 연체율 현황
          - 월별 연체 통계
        unsuitable_for:
          - 개별 대출 목록
          - 특정 대출의 연체 여부
          - 실시간 연체 현황
        signal_keywords: [연체율, 추이, 통계, 비율, 월별, 분기별, 지점별, 산출, 비교]

  - group_id: deposit_balance
    domain: 수신
    description: 예금 잔액 관련 테이블 그룹
    disambiguation_rule: "현재 시점 잔액/현황 → TB_DEPOSIT_INFO, 기간별 추이/변동/평균 잔액 → TB_DEPOSIT_DAILY_BAL"
    tables:
      TB_DEPOSIT_INFO:
        purpose: "계좌별 현재 상태 (잔액, 상품, 계좌상태)"
        update_cycle: 일배치
        suitable_for:
          - 현재 계좌 수
          - 현재 총 예금 잔액
          - 상품별 잔액 현황
        unsuitable_for:
          - 일별 잔액 변동
          - 기간별 잔액 추이
        signal_keywords: [현재, 현황, 잔액, 계좌 수, 상품별, 총, 합계]

      TB_DEPOSIT_DAILY_BAL:
        purpose: "계좌별 일별 잔액 스냅샷 (기간별 추이 분석용)"
        update_cycle: 일배치
        suitable_for:
          - 일별 잔액 추이
          - 기간별 잔액 변동
          - 평균 잔액 산출
        unsuitable_for:
          - 현재 시점 잔액 조회
          - 계좌 상태 확인
        signal_keywords: [추이, 변동, 증감, 일별, 평균 잔액, 기간, 변화]

  - group_id: customer_snapshot_vs_history
    domain: 고객
    description: 고객 현재 상태 vs 이력 테이블 그룹
    disambiguation_rule: "현재 고객 정보/신규/목록 → TB_CUST_INFO, 등급 변동/승급/강등 이력 → TB_CUST_GRADE_HIST"
    tables:
      TB_CUST_INFO:
        purpose: "고객 현재 기본 정보 (이름, 유형, 등록일, 지점)"
        update_cycle: 일배치
        suitable_for:
          - 현재 고객 수
          - 신규 고객 현황
          - 고객 유형별 현황
        unsuitable_for:
          - 고객 등급 변동 이력
          - 고객 이탈 추이
        signal_keywords: [고객 수, 신규, 유형별, 현황, 목록, 등록]

      TB_CUST_GRADE_HIST:
        purpose: "고객 등급 변동 이력 (월별 등급 변경 추적)"
        update_cycle: 월배치
        suitable_for:
          - 등급 변동 추이
          - VIP 승급/강등 현황
        unsuitable_for:
          - 현재 고객 기본 정보
          - 신규 고객 현황
        signal_keywords: [등급 변동, 승급, 강등, 이력, 등급 추이]
