[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "data-copilot"
version = "0.1.0"
description = "자연어 기반 데이터 추출/분석 AI 에이전트 서비스"
requires-python = ">=3.12,<3.13"
dependencies = [
    # LLM & Agent
    "anthropic>=0.40.0",
    "openai>=1.0.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.0",
    "psycopg[binary]>=3.1.0",
    
    # Search & Vector
    "elasticsearch>=8.0.0,<9.0.0",
    "qdrant-client>=1.12.0,<1.14.0",
    
    # MongoDB (테이블 메타 + 코드 메타 + 비즈 메타)
    "motor>=3.6.0",
    
    # ── Embedding (BGE-M3) & Reranker (BGE-Reranker-v2-m3) ──
    "FlagEmbedding>=1.3.0",
    "transformers>=4.45.0,<5.0.0",  # 5.x: FlagEmbedding 비호환
    "torch>=2.4.0",  # CPU 빌드: uv.toml 또는 pip.conf에서 index 지정
    "numpy>=1.26.0",
    
    # ── ONNX Runtime (Reranker CPU 최적화 + INT8 양자화) ──
    "onnxruntime>=1.18.0",
    "onnxscript>=0.6.0",  # torch.onnx.export 내부 의존
    
    # ── 시스템 유틸리티 ──
    "psutil>=5.9.0",  # CPU 물리 코어 감지 (Reranker 스레드 자동 설정)
    
    # Cache
    "redis>=5.0.0",
    
    # SQL Parsing
    "sqlglot>=25.0.0",
    
    # Validation & Config
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    
    # Utilities
    "httpx>=0.27.0",
    "structlog>=24.0.0",
    
    # Tracing (외부망 개발 환경 전용, 폐쇄망에서는 비활성화)
    "langsmith>=0.1.0",
    
    # Cloudera CDP 7.1.9 — Impala 4.0 / Hive 3.1.3 (HiveServer2 Thrift)
    "impyla>=0.20.0",            # 0.18~0.19는 Python 3.12 버그 포함
    "thrift==0.16.0",            # impyla 핀 고정 — 상위 버전 충돌 주의
    "thrift-sasl==0.4.3",        # impyla 핀 고정
    "pure-sasl>=0.6.2",          # LDAP/PLAIN SASL 메커니즘
    # "kerberos>=1.3.0",           # Kerberos(GSSAPI) 인증 — OS krb5-devel 필요
    
    # Sybase IQ 16.1 — ODBC 방식 또는 네이티브(sqlanydb) 방식 선택 가능
    "pyodbc>=5.0.0",               # ODBC 방식 (unixODBC + SAP ODBC 드라이버 필요)
    "sqlanydb>=1.0.13",            # 네이티브 방식 (libdbcapi_r.so만 필요, ODBC 불필요)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.11.0",
    "ruff>=0.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
